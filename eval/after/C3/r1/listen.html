<style>

  button.copy { padding: 6px 12px; border-radius: 6px; border: 1px solid #3a3a4a; background: #1e1e28; color: #cfcfe0; cursor: pointer; }

hese) ----\nlet form = {\n  A: \"<1!8 0!8 1!8 0!8>\",\n  B: \"<0!8 1!8 0!8 1!8>\",\n}\n\n// ---- voicing shapes (library: src/lib/voicings.js) ----\naddVoicings('me_drop2', { '6': ['-3 0 4 9'], '7': ['-2 0 4 10'], '': ['-5 0 4'], 'm': ['-5 0 3'], '^7': ['-1 0 4 11'], 'm7': ['-2 0 3 10'], 'm9': ['-2 0 3 10 14'], 'sus4': ['-5 0 5'], 'dim': ['-6 0 3'], 'o': ['-6 0 3 9'] }, ['C3', 'C6'])\naddVoicings('me_shell_37', { '6': ['4 9'], '7': ['4 10'], '': ['4 7'], 'm': ['3 7'], '^7': ['4 11'], 'm7': ['3 10'], 'm9': ['3 10 14'], 'sus4': ['5 7'], 'dim': ['3 6'], 'o': ['3 6'] }, ['C3', 'C5'])\n\n// ---- harmony ----\nlet harmony_A = chord(\"<Cm9 Fm9 Ab^7 Eb^7>/2\").dict('ireal')\nlet harmony_B = chord(\"<Fm9 Eb^7 Ab^7 Cm9>/2\").dict('ireal')\nlet chords = stack(\n  harmony_A.mask(form.A),\n  harmony_B.mask(form.B),\n)\n\n// ---- material: kick ----\nlet kick_A = s(\"bd ~@2 bd ~ bd ~@2\").gain(\"1@3 0.84@2 0.93@3\").bank(\"tr808\")\n\n// ---- material: snare ----\nlet snare_A = s(\"~@4 sd ~@2 sd ~@4 sd ~@2 sd\").gain(\"0.95@4 0.95@3 0.5@5 0.91@3 0.53\").bank(\"tr808\")\n\n// ---- material: hats ----\nlet hats_A = s(\"hh hh hh hh hh hh hh hh\").gain(\"0.7 0.44 0.6 0.46 0.68 0.43 0.6 0.5\").swingBy(0.55, 4).bank(\"tr808\")\n\n// ---- material: bass ----\nlet bass_A = note(\"<[C2@7 C2 G2@7 C2] [C2@7 C2 G2@7 C2] [C2@7 C2 G2@7 C2] [C2@7 C2 G2@7 C2] [C2@7 C2 G2@7 C2] [C2@7 C2 G2@7 C2] [C2@7 C2 G2@7 C2] [C2@7 C2 G2@7 C2]>\").s(\"sawtooth\").gain(\"0.97@7 0.74 0.9@7 0.81\").lpf(350)\n\n// ---- material: keys ----\nlet keys_A = chords.dict('me_shell_37').voicing().struct(\"x ~ ~ x ~ ~ ~ ~\").s(\"square\").lpf(850).room(0.45).gain(\".5 .42 .5 .42\").orbit(6)\nlet keys_B = chords.dict('me_drop2').voicing().struct(\"x ~ x ~ ~ x ~ x\").s(\"square\").lpf(1100).room(0.4).gain(\".5 .42 .46 .4\").orbit(6)\n\n// ---- material: lead ----\nlet lead_A = note(\"<[C4@3 F4] [C4@3 F4] [C4@3 F4] [C4@3 F4] [C4@3 F4] [C4@3 F4] [C4@3 F4] [C4@3 F4]>\").s(\"triangle\").gain(\"0.7@3 0.54\").lpf(1400).delay(0.3).room(0.5).orbit(7)\nlet lead_B = note(\"<[G4@3 G4@3 C5@2] [G4@3 Eb4@3 C4@2] [G4@3 G4@3 C5@2] [G4@3 Eb4@3 C4@2] [G4@3 G4@3 C5@2] [G4@3 Eb4@3 C4@2] [G4@3 G4@3 C5@2] [G4@3 Eb4@3 C4@2]>\").s(\"triangle\").gain(\"0.8@3 0.67@3 0.73@2\").lpf(1800).delay(0.35).room(0.4).orbit(7)\n\n// ---- material: perc ----\nlet perc_B = s(\"rim ~@2 rim ~@2 rim ~@3 rim ~ rim ~@3\").gain(\"0.6@3 0.53@3 0.56@4 0.5@2 0.55@4\").bank(\"tr808\")\n\n// ---- transition: riser_hat_swell: A -> B @ cycles 22-24 ----\nlet riser_B3 = s(\"hh*16\").gain(saw.range(0.12, 0.72).slow(2)).lpf(saw.range(1500, 9000).slow(2)).pan(0.5)\n\n// ---- transition: sweep_downlifter: B -> A @ cycles 16-17 ----\nlet sweep_A2 = s(\"oh*8\").gain(saw.range(0.55, 0.05)).lpf(saw.range(7000, 500)).pan(saw.range(0.3, 0.7))\n\n// ---- layers ----\nkick: stack(\n  kick_A.mask(form.A),\n  kick_A.mask(form.B),\n)\nsnare: stack(\n  snare_A.mask(form.A),\n  snare_A.mask(form.B),\n)\nhats: stack(\n  hats_A.mask(form.A),\n  hats_A.mask(form.B),\n)\nbass: stack(\n  bass_A.mask(form.A),\n  bass_A.mask(form.B),\n)\nkeys: stack(\n  keys_A.mask(form.A),\n  keys_B.mask(form.B),\n)\nlead: stack(\n  lead_A.mask(form.A),\n  lead_B.mask(form.B),\n)\nperc: perc_B.mask(form.B)\nriser: riser_B3.late(22).mask(\"<0!22 1!2 0!8>\")\nsweep: sweep_A2.late(16).mask(\"<0!16 1 0!15>\")\n","note":"velocity contour for the drums: widen each drum's gainRange from flat so the library accent profiles express — backbeats accented, ghost 16ths and offbeat hats drop to ghost level; onsets and sounds untouched"}],"labels":["kick","snare","hats","bass","keys","lead","perc","riser","sweep"],"listenFor":["The requested change: velocity contour for the drums: widen each drum's gainRange from flat so the library accent profiles express — backbeats accented, ghost 16ths and offbeat hats drop to ghost level; onsets and sounds untouched","hats: stronger accent contour — listen for louder/softer alternation instead of flat hits.","snare: stronger accent contour — listen for let currentVersion = DATA.versions.length - 1;
const muted = new Set();

function applyMutes(src) {
  let out = src;
  for (const label of DATA.labels) {
    const on = new RegExp('^(\\s*)' + label + ':', 'm');
    const off = new RegExp('^(\\s*)_' + label + ':', 'm');
    if (muted.has(label)) out = out.replace(on, '$1_' + label + ':');
    else out = out.replace(off, '$1' + label + ':');
  }
  return out;
}
function currentCode() { return applyMutes(DATA.versions[currentVersion].source); }
function render() {
  const holder = document.getElementById('repl');
  holder.innerHTML = '';
  const el = document.createElement('strudel-editor');
  el.setAttribute('code', currentCode());
  holder.appendChild(el);
  document.querySelectorAll('.vswitch button').forEach((b, i) => b.classList.toggle('active', i === currentVersion));
  document.getElementById('ccLink').href = 'https://strudel.cc/#' + encodeURIComponent(btoa(unescape(encodeURIComponent(currentCode()))));
}
const vs = document.getElementById('vswitch');
DATA.versions.forEach((v, i) => {
  const b = document.createElement('button');
  b.textContent = v.name;
  b.title = v.note || '';
  b.onclick = () => { currentVersion = i; render(); };
  vs.appendChild(b);
});
const ms = document.getElementById('mutes');
DATA.labels.forEach((label) => {
  const l = document.createElement('label');
  const c = document.createElement('input');
  c.type = 'checkbox'; c.checked = true;
  c.onchange = () => { c.checked ? muted.delete(label) : muted.add(label); render(); };
  l.appendChild(c); l.appendChild(document.createTextNode(' ' + label));
  ms.appendChild(l);
});
if (DATA.listenFor.length) {
  document.getElementById('listenfor').style.display = '';
  const ul = document.getElementById('listenforList');
  DATA.listenFor.forEach((x) => { const li = document.createElement('li'); li.textContent = x; ul.appendChild(li); });
}
document.getElementById('copyBtn').onclick = async () => {
  await navigator.clipboard.writeText(currentCode());
  document.getElementById('copyBtn').textContent = 'Copied ✓';
  setTimeout(() => document.getElementById('copyBtn').textContent = 'Copy current code (with mutes)', 1200);
};
render();
</script>
