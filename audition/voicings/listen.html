<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voicings v0 — listen</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.5 -apple-system, system-ui, sans-serif; margin: 0; background: #14141a; color: #e8e8ee; }
  header { padding: 14px 20px 10px; border-bottom: 1px solid #2b2b36; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  h1 { font-size: 16px; margin: 0 12px 0 0; }
  .vswitch button { margin-right: 6px; padding: 6px 14px; border-radius: 6px; border: 1px solid #3a3a4a; background: #1e1e28; color: #cfcfe0; cursor: pointer; font-weight: 600; }
  .vswitch button.active { background: #4c6ef5; border-color: #4c6ef5; color: #fff; }
  .mutes { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 8px 20px; border-bottom: 1px solid #2b2b36; }
  .mutes label { user-select: none; cursor: pointer; opacity: .9; }
  .mutes input { accent-color: #4c6ef5; }
  main { padding: 12px 20px; }
  #repl { min-height: 420px; }
  strudel-editor { display: block; }
  .panel { background: #1b1b24; border: 1px solid #2b2b36; border-radius: 8px; padding: 12px 16px; margin: 14px 0; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #9a9ab0; margin: 0 0 8px; }
  .panel ul { margin: 0; padding-left: 18px; }
  button.copy { padding: 6px 12px; border-radius: 6px; border: 1px solid #3a3a4a; background: #1e1e28; color: #cfcfe0; cursor: pointer; }
  a { color: #74a0ff; }
  .hint { color: #9a9ab0; font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <h1>voicings v0</h1>
  <div class="vswitch" id="vswitch"></div>
  <span class="hint">switch version or mutes, then hit play in the editor (ctrl+enter updates)</span>
</header>
<div class="mutes" id="mutes"></div>
<main>
  <div id="repl"></div>
  <div class="panel" id="listenfor" style="display:none"><h2>What to listen for</h2><ul id="listenforList"></ul></div>
  <div class="panel">
    <h2>Paste-ready</h2>
    <button class="copy" id="copyBtn">Copy current code (with mutes)</button>
    <a id="ccLink" target="_blank" style="margin-left:12px">open on strudel.cc</a>
    <div class="hint" style="margin-top:6px">The embedded REPL is pinned to strudel 1.1.0 (same as the engine). strudel.cc runs latest — both play this code.</div>
  </div>
</main>
<script src="https://unpkg.com/@strudel/repl@1.1.0/dist/index.js"></script>
<script>
const DATA = {"title":"voicings v0","versions":[{"name":"v0","source":"// ============ voicings ============\n// compiled by motif-engine (seed 1) — edit map in the song's meta.json\n// form: closed_stack drop2 shell_37 spread_tenth cluster_upper | 4/4 | 100 bpm | key C:minor\nsetcpm(100/4)\n\nlet key = \"C:minor\"\n\n// ---- form masks (compiled from form: closed_stack drop2 shell_37 spread_tenth cluster_upper; edit the SPEC, not these) ----\nlet form = {\n  closed_stack: \"<1!4 0!16>\",\n  drop2: \"<0!4 1!4 0!12>\",\n  shell_37: \"<0!8 1!4 0!8>\",\n  spread_tenth: \"<0!12 1!4 0!4>\",\n  cluster_upper: \"<0!16 1!4>\",\n}\n\n// ---- voicing shapes (library: src/lib/voicings.js) ----\naddVoicings('me_closed_stack', { '6': ['0 4 7 9'], '7': ['0 4 7 10'], '': ['0 4 7'], 'm': ['0 3 7'], '^7': ['0 4 7 11'], 'm7': ['0 3 7 10'], 'm9': ['0 3 7 10 14'], 'sus4': ['0 5 7'], 'dim': ['0 3 6'], 'o': ['0 3 6 9'] }, ['C3', 'C6'])\naddVoicings('me_cluster_upper', { '6': ['7 9 14'], '7': ['7 10 14'], '': ['7 11 14'], 'm': ['7 10 14'], '^7': ['7 11 14'], 'm7': ['7 10 14'], 'm9': ['10 14 15'], 'sus4': ['5 7 12'], 'dim': ['6 9 12'], 'o': ['6 9 12'] }, ['C4', 'C6'])\naddVoicings('me_drop2', { '6': ['-5 0 4 9'], '7': ['-5 0 4 10'], '': ['-5 0 4'], 'm': ['-5 0 3'], '^7': ['-5 0 4 11'], 'm7': ['-5 0 3 10'], 'm9': ['-5 0 3 10 14'], 'sus4': ['-5 0 5'], 'dim': ['-9 0 6'], 'o': ['-9 0 6 9'] }, ['C3', 'C6'])\naddVoicings('me_shell_37', { '6': ['4 9'], '7': ['4 10'], '': ['4 7'], 'm': ['3 7'], '^7': ['4 11'], 'm7': ['3 10'], 'm9': ['3 10 14'], 'sus4': ['5 7'], 'dim': ['3 6'], 'o': ['3 6'] }, ['C3', 'C5'])\naddVoicings('me_spread_tenth', { '6': ['0 9 16'], '7': ['0 10 16'], '': ['0 7 16'], 'm': ['0 7 15'], '^7': ['0 11 16'], 'm7': ['0 10 15'], 'm9': ['0 10 15 26'], 'sus4': ['0 7 17'], 'dim': ['0 6 15'], 'o': ['0 6 15'] }, ['C2', 'C6'])\n\n// ---- harmony ----\nlet harmony_closed_stack = chord(\"<Cm9 Ab^7 Fm7 G7>\").dict('ireal')\nlet harmony_drop2 = chord(\"<Cm9 Ab^7 Fm7 G7>\").dict('ireal')\nlet harmony_shell_37 = chord(\"<Cm9 Ab^7 Fm7 G7>\").dict('ireal')\nlet harmony_spread_tenth = chord(\"<Cm9 Ab^7 Fm7 G7>\").dict('ireal')\nlet harmony_cluster_upper = chord(\"<Cm9 Ab^7 Fm7 G7>\").dict('ireal')\nlet chords = stack(\n  harmony_closed_stack.mask(form.closed_stack),\n  harmony_drop2.mask(form.drop2),\n  harmony_shell_37.mask(form.shell_37),\n  harmony_spread_tenth.mask(form.spread_tenth),\n  harmony_cluster_upper.mask(form.cluster_upper),\n)\n\n// ---- material: pads ----\nlet pads_closed_stack = chords.dict('me_closed_stack').voicing().s(\"square\").lpf(1400).room(0.4).gain(0.6).orbit(2)\nlet pads_drop2 = chords.dict('me_drop2').voicing().s(\"square\").lpf(1400).room(0.4).gain(0.6).orbit(2)\nlet pads_shell_37 = chords.dict('me_shell_37').voicing().s(\"square\").lpf(1400).room(0.4).gain(0.6).orbit(2)\nlet pads_spread_tenth = chords.dict('me_spread_tenth').voicing().s(\"square\").lpf(1400).room(0.4).gain(0.6).orbit(2)\nlet pads_cluster_upper = chords.dict('me_cluster_upper').voicing().s(\"square\").lpf(1400).room(0.4).gain(0.6).orbit(2)\n\n// ---- layers ----\npads: stack(\n  pads_closed_stack.mask(form.closed_stack),\n  pads_drop2.mask(form.drop2),\n  pads_shell_37.mask(form.shell_37),\n  pads_spread_tenth.mask(form.spread_tenth),\n  pads_cluster_upper.mask(form.cluster_upper),\n)\n","note":"current"}],"labels":["pads"],"listenFor":[],"notes":[]};
let currentVersion = DATA.versions.length - 1;
const muted = new Set();

function applyMutes(src) {
  // labels live at column 0 — anchoring without leading whitespace keeps
  // indented object keys (form masks) safe even when a section shares the name
  let out = src;
  for (const label of DATA.labels) {
    const on = new RegExp('^' + label + ':', 'm');
    const off = new RegExp('^_' + label + ':', 'm');
    if (muted.has(label)) out = out.replace(on, '_' + label + ':');
    else out = out.replace(off, label + ':');
  }
  return out;
}
function currentCode() { return applyMutes(DATA.versions[currentVersion].source); }
function render() {
  const holder = document.getElementById('repl');
  holder.innerHTML = '';
  const el = document.createElement('strudel-editor');
  el.setAttribute('code', currentCode());
  holder.appendChild(el);
  document.querySelectorAll('.vswitch button').forEach((b, i) => b.classList.toggle('active', i === currentVersion));
  document.getElementById('ccLink').href = 'https://strudel.cc/#' + encodeURIComponent(btoa(unescape(encodeURIComponent(currentCode()))));
}
const vs = document.getElementById('vswitch');
DATA.versions.forEach((v, i) => {
  const b = document.createElement('button');
  b.textContent = v.name;
  b.title = v.note || '';
  b.onclick = () => { currentVersion = i; render(); };
  vs.appendChild(b);
});
const ms = document.getElementById('mutes');
DATA.labels.forEach((label) => {
  const l = document.createElement('label');
  const c = document.createElement('input');
  c.type = 'checkbox'; c.checked = true;
  c.onchange = () => { c.checked ? muted.delete(label) : muted.add(label); render(); };
  l.appendChild(c); l.appendChild(document.createTextNode(' ' + label));
  ms.appendChild(l);
});
if (DATA.listenFor.length) {
  document.getElementById('listenfor').style.display = '';
  const ul = document.getElementById('listenforList');
  DATA.listenFor.forEach((x) => { const li = document.createElement('li'); li.textContent = x; ul.appendChild(li); });
}
document.getElementById('copyBtn').onclick = async () => {
  await navigator.clipboard.writeText(currentCode());
  document.getElementById('copyBtn').textContent = 'Copied ✓';
  setTimeout(() => document.getElementById('copyBtn').textContent = 'Copy current code (with mutes)', 1200);
};
render();
</script>
</body>
</html>
