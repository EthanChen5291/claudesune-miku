<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>facets — audition</title>
<style>
  :root { color-scheme: dark; --bg:#14141a; --panel:#1b1b24; --line:#2b2b36; --fg:#e8e8ee; --dim:#9a9ab0; --accent:#4c6ef5; --keep:#37b24d; --kill:#e03131; }
  * { box-sizing: border-box; }
  body { font: 13.5px/1.5 -apple-system, system-ui, sans-serif; margin:0; background:var(--bg); color:var(--fg); }
  header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:10px 18px 8px; }
  .row { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; }
  h1 { font-size:15px; margin:0 8px 0 0; }
  h2 { font-size:13px; margin:20px 0 7px; color:var(--dim); font-weight:600; letter-spacing:.03em; }
  .dim { color:var(--dim); font-size:12.5px; }
  .hint { color:var(--dim); font-size:12px; max-width:78ch; margin:2px 0 12px; }
  label.ctl { display:inline-flex; align-items:center; gap:6px; color:var(--dim); }
  select, input[type=search] { background:#1e1e28; color:var(--fg); border:1px solid #3a3a4a; border-radius:6px; padding:4px 8px; font:inherit; }
  input[type=range] { accent-color:var(--accent); width:100px; vertical-align:middle; }
  input[type=checkbox] { accent-color:var(--accent); }
  button { font:inherit; border-radius:6px; border:1px solid #3a3a4a; background:#1e1e28; color:#cfcfe0; cursor:pointer; padding:4px 10px; }
  button:hover { border-color:#5a5a6e; }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .now { font-variant-numeric:tabular-nums; color:var(--accent); font-weight:600; }
  main { padding:12px 18px 70px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:8px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:8px 10px 7px; cursor:pointer; position:relative; }
  .tile:hover { border-color:#4a4a5e; }
  .tile.playing { background:#1e2438; border-color:var(--accent); }
  .tile.good { border-left:3px solid var(--keep); }
  .tile.bad { border-left:3px solid var(--kill); opacity:.45; }
  .tile.dead { opacity:.3; cursor:not-allowed; }
  .big { font-weight:650; font-size:15px; letter-spacing:.02em; }
  .sub { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; color:var(--dim); }
  .acts { display:flex; gap:5px; margin-top:6px; }
  .acts button { padding:1px 9px; font-size:11.5px; }
  .acts button.g.on { background:var(--keep); border-color:var(--keep); color:#fff; }
  .acts button.b.on { background:var(--kill); border-color:var(--kill); color:#fff; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:11px 13px; margin-bottom:9px; }
  .card h3 { margin:0 0 2px; font-size:14.5px; }
  .strip { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { border:1px solid var(--line); background:#1e1e28; border-radius:7px; padding:5px 9px; cursor:pointer; font-size:12.5px; display:flex; gap:7px; align-items:center; }
  .chip:hover { border-color:#5a5a6e; }
  .chip.playing { background:#1e2438; border-color:var(--accent); }
  .chip.good { border-color:var(--keep); background:#15281a; }
  .chip.bad { border-color:var(--kill); background:#2a1616; opacity:.55; }
  .chip.dead { opacity:.3; cursor:not-allowed; }
  .chip .x { color:var(--dim); font-size:11px; padding:0 2px; border-radius:4px; }
  .chip .x:hover { color:var(--kill); }
  footer { position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:1px solid var(--line); padding:7px 18px; display:flex; gap:16px; align-items:center; font-size:12.5px; }
  kbd { background:#252531; border:1px solid #3a3a4a; border-radius:4px; padding:0 5px; font:11.5px ui-monospace,monospace; }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>facets — audition</h1>
    <button class="tab on" id="tab-pairs" data-tab="pairs">1 · pairs</button>
    <button class="tab" id="tab-textures" data-tab="textures">2 · textures</button>
    <button class="tab" id="tab-cadences" data-tab="cadences">3 · cadences</button>
    <span class="now" id="now">— click anything to play —</span>
    <button id="stop">■ stop</button>
  </div>
  <div class="row" style="margin-top:7px">
    <label class="ctl">format <span id="tex"></span></label>
    <label class="ctl"><input type="checkbox" id="bass"> bass <span class="dim" id="bassLabel"></span></label>
    <label class="ctl"><input type="checkbox" id="withBlock"> + block chords under figures</label>
    <label class="ctl">bpm <input type="range" id="bpm" min="60" max="170" value="104"><span id="bpmv">104</span></label>
  </div>
  <div class="row" style="margin-top:7px" id="pairCtl">
    <label class="ctl">family <select id="fFam"><option>minor</option><option>major</option><option>modal</option></select></label>
    <label class="ctl">order <select id="fSort">
      <option value="leverage">leverage — where a vote moves the model most</option>
      <option value="rare">rarest in the corpus first</option>
      <option value="common">commonest first</option>
      <option value="degree">by starting degree</option>
    </select></label>
    <label class="ctl">from <select id="fFrom"><option value="">any chord</option></select></label>
    <label class="ctl"><input type="checkbox" id="fUnjudged"> hide what I've judged</label>
    <input type="search" id="fText" placeholder="search chords / numerals">
  </div>
</header>
<main>
  <div id="pairs"></div>
  <div id="textures" hidden></div>
  <div id="cadences" hidden></div>
</main>
<footer>
  <span id="tally"></span>
  <span style="flex:1"></span>
  <span class="dim"><kbd>space</kbd> replay <kbd>esc</kbd> stop</span>
  <button id="export">copy facet JSON</button>
</footer>
<script src="https://unpkg.com/@strudel/web@1.1.0/dist/index.js"></script>
<script>

// Full https URLs, NOT the github: shorthand: strudel's samples() appends
// "strudel.json" to any github: path, so github:.../piano.json resolves to
// ".../piano.json/strudel.json" and 404s. Two maps, because the pages need both
// a piano and Dirt-named drums, and initStrudel() prebakes neither.
// Each map lists MIRRORS, tried in order until one answers. raw.githubusercontent
// is the canonical host but browsers hit it inconsistently (rate limits, CORS
// from file://, extensions blocking it); jsdelivr serves the identical files
// from a CDN built for browser traffic. One flaky host must not mean silence.
const SAMPLE_MAPS = {
  drums: [
    'https://raw.githubusercontent.com/tidalcycles/dirt-samples/master/strudel.json',
    'https://cdn.jsdelivr.net/gh/tidalcycles/dirt-samples@master/strudel.json',
  ],
  piano: [
    'https://raw.githubusercontent.com/felixroos/dough-samples/main/piano.json',
    'https://cdn.jsdelivr.net/gh/felixroos/dough-samples@main/piano.json',
  ],
};
// If the piano map is unreachable but the soundfont bank loaded, the page can
// still play a piano — a General MIDI one. Losing the sampled piano is a
// downgrade; losing the whole page is not acceptable.
// NOT gm_acoustic_piano — that name appears in the package's tables but is not
// one of the 125 the bank actually registers. Verified against a real
// registerSoundfonts() run; a fallback that names a sound nobody registered is
// no fallback at all.
const PIANO_FALLBACK = 'gm_piano';
// General MIDI soundfonts (~128 instruments: gm_music_box, gm_vibraphone,
// gm_epiano1, gm_pad_warm …). @strudel/web does NOT bundle these — it is a
// separate ES module that registers the gm_* sound names; each font's audio is
// then fetched lazily the first time that instrument sounds, so registering is
// cheap. If it fails the page must not go silent: every gm_* voice is rewritten
// to a bundled fallback before evaluation. See D48 in the generator for why
// this needs a rewrite pass rather than a plain import().
const WEB_BUNDLE_URLS = ["https://unpkg.com/@strudel/web@1.1.0/dist/index.js","https://cdn.jsdelivr.net/npm/@strudel/web@1.1.0/dist/index.js"];
const SOUNDFONT_URLS = ["https://unpkg.com/@strudel/soundfonts@1.1.0/dist/index.mjs","https://cdn.jsdelivr.net/npm/@strudel/soundfonts@1.1.0/dist/index.mjs"];
const SFUMATO_URLS = ["https://unpkg.com/sfumato@0.1.2/dist/sfumato.js","https://cdn.jsdelivr.net/npm/sfumato@0.1.2/dist/sfumato.js"];
const SOUNDFONT2_URLS = ["https://unpkg.com/soundfont2@0.4.0/lib/SoundFont2.js","https://cdn.jsdelivr.net/npm/soundfont2@0.4.0/lib/SoundFont2.js"];
const SOUNDFONT2_EXPORTS = ["DEFAULT_GENERATOR_VALUES","SoundFont2"];
const SHIM_EXPORTS = {"@strudel/core":["freqToMidi","noteToMidi","getSoundIndex","Pattern","getPlayableNoteValue"],"@strudel/webaudio":["registerSound","getADSRValues","getAudioContext","getParamADSR","getVibratoOscillator","getPitchEnvelope"]};
const GM_FALLBACK = 'triangle';
const BUILD = '2026-08-25 18:24';
const RT = { ready: false, booting: null, note: '', soundfonts: false, gmVoices: 0, gen: 0, maps: {}, problems: [],
  // D56: set once the scheduler tick is running off a Web Worker, so a hidden
  // tab cannot clamp it to 1s. workerTicks is how a probe proves it is live.
  workerClock: false, workerTimers: 0, workerTicks: 0, workerClockFellBack: false };
// Exposed deliberately: when a page will not play, "open the console and read
// RT" is the whole diagnosis — which mirrors loaded, whether the soundfont bank
// registered, whether the background-safe clock is live, and what went wrong.
globalThis.RT = RT;

function shimSource(names) {
  return 'const s = globalThis.strudel;\n'
    + names.map((n) => 'export const ' + n + ' = s.' + n + ';').join('\n');
}
function soundfont2ShimSource(url, names) {
  return 'await import(' + JSON.stringify(url) + ');\n'
    + 'const ns = globalThis.SoundFont2;\n'
    + 'if (!ns) throw new Error("soundfont2 loaded but set no global to read");\n'
    + names.map((n) => 'export const ' + n + ' = ns.' + n + ';').join('\n');
}
function rewriteSoundfontSource(src, shims) {
  let out = String(src);
  for (const [spec, target] of Object.entries(shims)) {
    out = out.split('"' + spec + '"').join('"' + target + '"');
    out = out.split("'" + spec + "'").join("'" + target + "'");
  }
  const left = [];
  const re = /\bfrom\s*["']([^"']+)["']/g;
  let m;
  while ((m = re.exec(out))) if (!/^(https?:|blob:|data:|\.{0,2}\/)/.test(m[1])) left.push(m[1]);
  if (left.length) {
    throw new Error('unresolvable imports survived the rewrite (' + [...new Set(left)].join(', ')
      + ') - @strudel/soundfonts changed its dependencies');
  }
  return out;
}

const rtBlob = (src) => URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
/** a module re-exporting the live strudel globals, addressable by URL */
function rtShim(names) {
  const missing = names.filter((n) => !(n in (globalThis.strudel || {})));
  if (missing.length) {
    throw new Error('the strudel bundle is missing ' + missing.join(', ')
      + ' - the soundfont shim cannot be built against it');
  }
  return rtBlob(shimSource(names));
}
/** first mirror that answers, as text */
async function rtFetchText(urls, what) {
  const errors = [];
  for (const url of urls) {
    try {
      const res = await Promise.race([
        fetch(url),
        rtSleep(20000).then(() => { throw new Error('timed out'); }),
      ]);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.text();
    } catch (e) {
      errors.push('  ' + url + ' - ' + (e && e.message ? e.message : e));
    }
  }
  throw new Error(what + ' unreachable:\n' + errors.join('\n'));
}
/** sfumato, with its broken soundfont2 import repointed at a working shim */
async function rtSfumatoShim() {
  // the UMD is fetched and blobbed like everything else rather than imported
  // by URL, so it gets the same mirror list as the rest of the chain
  const umd = rtBlob(await rtFetchText(SOUNDFONT2_URLS, 'soundfont2'));
  const sf2 = rtBlob(soundfont2ShimSource(umd, SOUNDFONT2_EXPORTS));
  const src = await rtFetchText(SFUMATO_URLS, 'sfumato');
  return rtBlob(rewriteSoundfontSource(src, { soundfont2: sf2 }));
}
async function rtLoadSoundfonts() {
  const errors = [];
  // Count what actually registers rather than trusting that the import
  // succeeded: "the module loaded" and "there are 125 playable instruments" are
  // different claims, and only the second is the one an ear can hear.
  //
  // The counter has to go on BEFORE the shims are built. shimSource() captures
  // registerSound BY VALUE when the shim module evaluates, so a wrapper
  // installed afterwards is invisible to every call the bank makes — the first
  // version of this counted zero every time and disabled the whole bank.
  let count = 0;
  const realRegister = globalThis.strudel && globalThis.strudel.registerSound;
  if (realRegister) {
    globalThis.strudel.registerSound = function (name) {
      if (/^gm_/.test(name)) count++;
      return realRegister.apply(this, arguments);
    };
  }
  try {
    let shims;
    try {
      shims = { sfumato: await rtSfumatoShim() };
      for (const [spec, names] of Object.entries(SHIM_EXPORTS)) shims[spec] = rtShim(names);
    } catch (e) {
      return { ok: false, detail: 'General MIDI soundfonts unavailable:\n  ' + (e && e.message ? e.message : e) };
    }
    for (const url of SOUNDFONT_URLS) {
      try {
        const src = await rtFetchText([url], 'soundfonts');
        const mod = await import(rtBlob(rewriteSoundfontSource(src, shims)));
        if (typeof mod.registerSoundfonts !== 'function') throw new Error('no registerSoundfonts export');
        const before = count;
        mod.registerSoundfonts();
        if (count === before) throw new Error('registerSoundfonts() ran but registered no gm_ voices');
        return { ok: true, url, count: count - before };
      } catch (e) {
        errors.push('  ' + url + ' - ' + (e && e.message ? e.message : e));
      }
    }
  } finally {
    if (realRegister) globalThis.strudel.registerSound = realRegister;
  }
  return { ok: false, detail: 'General MIDI soundfonts unavailable:\n' + errors.join('\n') };
}

function rtBanner(msg, kind) {
  let el = document.getElementById('rtbanner');
  if (!el) {
    el = document.createElement('div');
    el.id = 'rtbanner';
    el.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99;padding:8px 16px;font:13px/1.5 -apple-system,system-ui,sans-serif;white-space:pre-wrap';
    document.body.appendChild(el);
  }
  el.style.background = kind === 'error' ? '#4a1420' : '#14304a';
  el.style.color = kind === 'error' ? '#ffb3c0' : '#bfe0ff';
  el.style.borderBottom = '1px solid ' + (kind === 'error' ? '#7d2437' : '#2b5a80');
  el.textContent = msg;
  el.style.display = msg ? '' : 'none';
}
window.addEventListener('error', (e) => rtBanner('JS error: ' + (e.message || e.error) + '  (' + (e.filename || '') + ':' + (e.lineno || '?') + ')', 'error'));
window.addEventListener('unhandledrejection', (e) => rtBanner('Unhandled: ' + (e.reason && e.reason.message ? e.reason.message : e.reason), 'error'));

function rtStatus(s) {
  RT.note = s;
  const el = document.getElementById('rtstatus');
  if (el) el.textContent = s;
}

const rtSleep = (ms) => new Promise((r) => setTimeout(r, ms));

const rtBundleReady = () => typeof strudel !== 'undefined' && typeof window.initStrudel === 'function';

function rtInjectScript(url) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = url;
    el.onload = () => resolve();
    el.onerror = () => reject(new Error('blocked or unreachable'));
    document.head.appendChild(el);
  });
}

/** The page's own <script src> is the first attempt; if that host is blocked,
 *  try the mirrors before declaring the page dead. Returns the errors so the
 *  message can name what was actually tried rather than blaming the user. */
async function rtLoadBundle() {
  if (rtBundleReady()) return { ok: true };
  const errors = [];
  for (const url of WEB_BUNDLE_URLS) {
    try {
      await rtInjectScript(url);
      if (rtBundleReady()) return { ok: true, url };
      errors.push('  ' + url + ' — loaded but set no global');
    } catch (e) {
      errors.push('  ' + url + ' — ' + (e && e.message ? e.message : e));
    }
  }
  return { ok: false, errors };
}

/**
 * A TIMER THAT A BACKGROUND TAB CANNOT THROTTLE (D56).
 *
 * Ethan: "if i leave the page the music doesnt slow down dramatically".
 *
 * Strudel's scheduler clock is, in the 1.1.0 bundle:
 *
 *   function ol(getTime, tick, duration=.05, interval=.1, overlap=.1,
 *               r = globalThis.setInterval, s = globalThis.clearInterval)
 *
 * It wakes every 100ms and schedules only (interval + overlap) = 200ms of audio
 * ahead. Chrome clamps main-thread setInterval to ONE SECOND in a hidden tab, so
 * the scheduler wakes 5x too slowly for the lookahead it keeps — the audio graph
 * starves and the music staggers. That is the whole bug: not a CPU problem, a
 * wake-up problem.
 *
 * Timers inside a Web Worker are not clamped the same way, so the tick is moved
 * there. createClock reads the timer functions off globalThis as DEFAULT
 * PARAMETERS, evaluated when the clock is constructed, so replacing them is all
 * it takes — no fork, no patched bundle.
 *
 * ONLY SHORT INTERVALS ARE REROUTED. Anything at or under RT_TICK_MAX_MS is an
 * audio scheduler; longer ones are UI housekeeping that SHOULD idle when the tab
 * is hidden, and stealing those into a worker would keep the tab awake for no
 * benefit.
 *
 * Verified from file://: a blob: Worker constructs and round-trips there, which
 * is not true of blob: AudioWorklets — so this is the one unthrottled clock
 * available to a page opened straight off disk.
 */
const RT_TICK_MAX_MS = 250;

function rtInstallWorkerClock() {
  if (RT.workerClock || typeof Worker === 'undefined') return;
  const src = 'const t = {};'
    + 'onmessage = (e) => { const d = e.data;'
    + ' if (d.a === "set") { t[d.id] = setInterval(() => postMessage(d.id), d.ms); }'
    + ' else if (d.a === "clear") { clearInterval(t[d.id]); delete t[d.id]; } };';
  let w;
  try {
    w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  } catch (e) {
    // No worker (a stricter file:// policy, an extension). Native timers still
    // work; the tab just throttles when hidden, which is the old behaviour.
    RT.problems.push('background-safe timer unavailable (' + e.message
      + ') — audio may stagger while this tab is in the background');
    return;
  }
  const cbs = new Map();
  const live = new Map();   // id -> { native, seen }
  let next = 1;
  w.onmessage = (e) => {
    const rec = live.get(e.data);
    if (rec) rec.seen = true;
    const fn = cbs.get(e.data);
    if (fn) { RT.workerTicks++; fn(); }
  };
  const nativeSet = globalThis.setInterval.bind(globalThis);
  const nativeClear = globalThis.clearInterval.bind(globalThis);
  const nativeTimeout = globalThis.setTimeout.bind(globalThis);

  globalThis.setInterval = (fn, ms, ...rest) => {
    if (!(ms <= RT_TICK_MAX_MS)) return nativeSet(fn, ms, ...rest);
    const id = 'w' + (next++);
    cbs.set(id, fn);
    live.set(id, { native: null, seen: false });
    RT.workerTimers++;
    w.postMessage({ a: 'set', id, ms });
    // WATCHDOG. Rerouting the clock is only worth doing if it cannot make things
    // WORSE than the bug it fixes, and a worker that never ticks would not
    // stagger the audio — it would stop it dead. So every rerouted timer is
    // given a deadline: if the worker has produced nothing by the time several
    // ticks were due, that timer silently reverts to a native one and RT says so.
    const rec = live.get(id);
    rec.native = nativeTimeout(() => {
      if (rec.seen || !live.has(id)) return;
      w.postMessage({ a: 'clear', id });
      RT.workerClockFellBack = true;
      const fallback = nativeSet(fn, ms, ...rest);
      rec.fallbackId = fallback;
    }, Math.max(600, ms * 5));
    return id;
  };
  globalThis.clearInterval = (id) => {
    if (typeof id === 'string' && id[0] === 'w') {
      const rec = live.get(id);
      if (rec) {
        if (rec.native != null) clearTimeout(rec.native);
        if (rec.fallbackId != null) nativeClear(rec.fallbackId);
      }
      cbs.delete(id); live.delete(id);
      w.postMessage({ a: 'clear', id });
      return;
    }
    return nativeClear(id);
  };
  RT.workerClock = true;
}

async function rtInit() {
  if (RT.ready) return;
  if (RT.booting) return RT.booting;
  RT.booting = (async () => {
    if (!rtBundleReady()) {
      rtStatus('fetching the audio bundle…');
      const got = await rtLoadBundle();
      if (!got.ok) {
        throw new Error('the strudel audio bundle could not be loaded from any mirror:\n'
          + got.errors.join('\n')
          + '\nThe page needs network access the first time. A content blocker on CDN scripts will do this too.');
      }
    }
    rtStatus('starting audio…');
    // BEFORE initStrudel(), which is where the scheduler clock is constructed
    // and where it captures its timer functions off globalThis.
    rtInstallWorkerClock();
    await window.initStrudel();
    // Browsers start the AudioContext suspended until a user gesture. Every call
    // path here is inside a click, but resume() explicitly rather than assuming.
    try {
      const ac = strudel.getAudioContext && strudel.getAudioContext();
      if (ac && ac.state !== 'running') await ac.resume();
    } catch (e) { /* older bundles expose no context getter */ }
    rtStatus('loading soundfonts…');
    const sf = await rtLoadSoundfonts();
    RT.soundfonts = sf.ok;
    RT.gmVoices = sf.count || 0;
    if (!sf.ok) {
      RT.problems.push(sf.detail + '\nEvery gm_* voice falls back to "' + GM_FALLBACK
        + '", so the whole General MIDI palette sounds like one synth.');
    }
    rtStatus('loading samples…');
    // Never block forever on a sample fetch, and never let one map take the
    // other down: drums failing should not cost you the piano. A hung request
    // is indistinguishable from a broken page from the outside.
    const loadMap = async (name, urls) => {
      const errors = [];
      for (const url of urls) {
        try {
          await Promise.race([
            strudel.samples(url),
            rtSleep(20000).then(() => { throw new Error('timed out'); }),
          ]);
          RT.maps[name] = url;
          return { name, ok: true };
        } catch (e) {
          errors.push('  ' + url + ' — ' + (e && e.message ? e.message : e));
        }
      }
      return { name, ok: false, detail: name + ' samples unreachable:\n' + errors.join('\n') };
    };
    const results = await Promise.all(Object.entries(SAMPLE_MAPS).map(([n, urls]) => loadMap(n, urls)));
    const failed = results.filter((r) => !r.ok);
    RT.ready = true;
    if (failed.length === results.length && !RT.soundfonts) {
      throw new Error('nothing can sound: every sample mirror failed AND the soundfont bank did not load.\n'
        + failed.map((f) => f.detail).join('\n')
        + '\nCheck network access, or an extension blocking raw.githubusercontent.com and jsdelivr.net.');
    }
    if (failed.length) {
      const pianoGone = !RT.maps.piano;
      RT.problems.push('Some sample maps are unavailable'
        + (pianoGone && RT.soundfonts ? ' — the piano falls back to the General MIDI "' + PIANO_FALLBACK + '"' : ', the rest will play')
        + ':\n' + failed.map((f) => f.detail).join('\n'));
    }
    // Report EVERY subsystem that degraded, not just the last to fail. The old
    // code cleared the banner whenever the sample maps loaded, which wiped the
    // soundfont warning off the screen — so the page quietly reduced the whole
    // GM palette to one synth and then said nothing at all about it.
    rtBanner(RT.problems.join('\n\n'), RT.problems.length ? 'error' : null);
    // Say what is actually loaded, every time. "Still triangle" cost two rounds
    // of guessing because the page reported nothing once it stopped erroring:
    // there was no way to tell a working build from a stale one without an ear.
    rtStatus(RT.soundfonts
      ? 'ready · ' + RT.gmVoices + ' GM voices · build ' + BUILD
      : 'ready · GM UNAVAILABLE, every instrument is the "' + GM_FALLBACK + '" synth · build ' + BUILD);
  })();
  try { await RT.booting; } finally { RT.booting = null; }
}

/** Swap sounds whose source never loaded for ones that did, so a missing
 *  dependency degrades the timbre instead of silencing the page. */
function rtSubstituteSounds(code) {
  let out = String(code);
  if (!RT.soundfonts) out = out.replace(/\.s\("gm_[a-z0-9_]+"\)/g, '.s("' + GM_FALLBACK + '")');
  if (!RT.maps.piano && RT.soundfonts) out = out.replace(/\.s\("piano"\)/g, '.s("' + PIANO_FALLBACK + '")');
  return out;
}

/** play(code) -> true if it started, false if it reported a reason instead.
 *  Plays are GENERATION-GUARDED: booting and sample loading are async, so two
 *  quick clicks used to race and leave both patterns sounding. Each call takes
 *  a ticket; a call that finds itself superseded hushes and bows out, and the
 *  previous pattern is always hushed before the next is evaluated. */
async function rtPlay(code) {
  const gen = ++RT.gen;
  try {
    await rtInit();
    if (gen !== RT.gen) return false; // a newer click won while we were booting
    try { strudel.hush(); } catch (e) {}
    await strudel.evaluate(rtSubstituteSounds(code));
    if (gen !== RT.gen) { try { strudel.hush(); } catch (e) {} return false; }
    return true;
  } catch (e) {
    if (gen !== RT.gen) return false;
    rtBanner('Could not play: ' + (e && e.message ? e.message : e), 'error');
    rtStatus('error');
    return false;
  }
}
function rtStop() { RT.gen++; try { if (RT.ready) strudel.hush(); } catch (e) {} }

async function rtCopy(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  return ok;
}

// If the bundle never arrived, say so up front instead of on first click.
window.addEventListener('load', () => {
  if (typeof strudel === 'undefined') {
    rtBanner('The strudel audio bundle did not load from unpkg.com — the page will render but cannot play. Check network access or an extension blocking CDN scripts, then reload.', 'error');
  }
});

"}},"textures":{},"cadences":{}},"familyOf":{"ut_alphys_p1":"major","ut_dating_fight_p1":"minor","ut_dating_fight_p2":"minor","ut_gasters_theme_p1":"minor","ut_megalovania_p1":"minor","ut_megalovania_p3":"minor","ut_once_upon_a_time_p3":"major","ut_ruins_p1":"minor","ut_tem_shop_p1":"major","ut_uwa_so_temperate_p1":"minor","un_famous_ariana_grande_thank_u_next_vimaj7_v7_im7_iii7":"minor","un_famous_billie_eilish_everything_i_wanted_ivmaj7_v_iii_ivmaj7":"major","un_famous_dababy_roddy_rich_rockstar_i_iii_vii_vi":"minor","un_famous_daft_punk_pharrell_williams_get_lucky_im7_iii_vm7_iv":"minor","un_famous_david_bowie_space_oddity_vi_i_vi_i_iv_vi_vii":"minor","un_famous_disclosure_flume_you_me_remix_ii_i6_vi_iii_iv_i6_iii":"major","un_famous_duke_dumont_ocean_drive_i_vii_vimaj7_iv":"minor","un_famous_john_waite_missing_you_i_ivsus_vsus":"major","un_famous_led_zeppelin_stairway_to_heaven_i_iiimaj7_5_iii_iv_vimaj7_vii_i":"minor","un_famous_lil_tecca_ransom_i_vi_v_v":"minor","un_famous_marvin_gaye_sexual_healing_v_vim7_iii_iv_i":"major","un_famous_mat_zo_porter_robinson_easy_ivmaj7_i_v13sus_v11_ivmaj7_i_v13sus_iim7":"major","un_famous_odesza_madelyn_grant_sun_models_iii_v_im7":"minor","un_famous_post_malone_circles_imaj7_iii_iv_iv_imaj7_v_ivmaj7_v6":"major","un_famous_r_f_s_du_sol_treat_you_better_i_ivsus_vim7_vadd11":"major","un_famous_the_chainsmokers_halsey_closer_viadd9_viiadd11_im7_viiadd11":"minor","un_famous_the_weeknd_kendrick_lamar_pray_for_me_i_vii_iv_vi":"minor","un_famous_ti_sto_post_malone_jackie_chan_ivm7_vm7_im7_vii":"minor","un_famous_tracy_chapman_fast_car_ivmaj7_i5_vi_vadd11":"major","un_famous_ynw_melly_murder_on_my_mind_vimaj7_ivm7_i_v7_vimaj7_ivm7_i_vm7":"minor","un_famous_zhu_faded_i_im7_i_im7_i_im7_v7":"major"}};
const LS = 'motif-engine:facet-verdicts';

// Three states everywhere: undefined (not judged), 'good', 'bad'. The seeds are
// what Ethan has already said in conversation, pre-loaded so the page never asks
// him to repeat himself; localStorage wins over a seed once he touches a tile.
let V = { pairs:{}, wraps:{}, chords:{}, textures:{}, cadences:{} };
for (const bag of Object.keys(V)) {
  for (const [k, rec] of Object.entries(DATA.seed[bag] || {})) V[bag][k] = rec.verdict;
}
try {
  const saved = JSON.parse(localStorage.getItem(LS) || '{}');
  for (const bag of Object.keys(V)) Object.assign(V[bag], saved[bag] || {});
} catch {}

let tab = 'pairs', texture = 'block', playing = null;
const $ = (id) => document.getElementById(id);
const save = () => localStorage.setItem(LS, JSON.stringify(V));
const texOf = (id) => DATA.textures.find((t) => t.id === id);

function codeFor(expr, bassExpr, opts) {
  if (!expr) return null;
  const parts = [expr];
  if (opts && opts.block) parts.push(opts.block);
  if ($('bass').checked && bassExpr) parts.push(bassExpr);
  const bpm = Number($('bpm').value) || 104;
  return 'setcpm(' + bpm + '/4)\n' + DATA.preamble + '\np: stack(' + parts.join(', ') + ')';
}

async function play(id, expr, bassExpr, label, opts) {
  const code = codeFor(expr, bassExpr, opts);
  if (!code) return;
  $('now').textContent = RT.ready ? '…' : 'starting audio (first play loads the piano)…';
  const ok = await rtPlay(code);
  if (!ok) { playing = null; render(); return; }
  playing = id;
  $('now').textContent = '▶ ' + label;
  render();
}
function stop() { rtStop(); playing = null; $('now').textContent = '— stopped —'; render(); }

function vote(bag, key, val) {
  V[bag][key] = V[bag][key] === val ? undefined : val;
  if (!V[bag][key]) delete V[bag][key];
  save(); render();
}

/** a ✓ / ✗ pair; 'bags' is [[bag,key], ...] so one click can record a motion AND
 *  the chord that motion landed on, which is how "Cm->Bm good, Cm->B bad" stays
 *  two separate facts instead of cancelling out into nothing. */
function acts(bags) {
  const el = document.createElement('div');
  el.className = 'acts';
  const state = V[bags[0][0]][bags[0][1]];
  for (const [cls, val, txt] of [['g', 'good', '✓ works'], ['b', 'bad', '✗ no']]) {
    const b = document.createElement('button');
    b.className = cls + (state === val ? ' on' : '');
    b.textContent = txt;
    b.onclick = (ev) => {
      ev.stopPropagation();
      const next = state === val ? undefined : val;
      for (const [bag, key] of bags) {
        if (next) V[bag][key] = next; else delete V[bag][key];
      }
      save(); render();
    };
    el.appendChild(b);
  }
  return el;
}

// ---------------------------------------------------------------------------
function renderPairs() {
  const host = $('pairs');
  host.innerHTML = '';
  const fam = $('fFam').value;
  const q = $('fText').value.trim().toLowerCase();
  const fromSel = $('fFrom').value;
  // The pair grid is only precomputed in two formats (see PAIR_TEXTURES). Silently
  // falling back beats showing an empty grid, but it must SAY so — a page that
  // quietly plays something other than the selected format is worse than one that
  // plays nothing, because you would trust the verdict.
  const pt = DATA.pairTextures.includes(texture) ? texture : DATA.pairTextures[0];
  let rows = DATA.pairs.filter((p) => p.family === fam && p.exprs[pt]);
  if (fromSel !== '') rows = rows.filter((p) => String(p.from) === fromSel);
  if (q) rows = rows.filter((p) => (p.label + ' ' + p.numerals).toLowerCase().includes(q));
  if ($('fUnjudged').checked) rows = rows.filter((p) => !V.pairs[p.family + '|' + p.motion] && !V.chords[p.family + '|' + p.chord]);
  const sort = $('fSort').value;
  rows = rows.slice().sort((a, b) =>
    sort === 'leverage' ? b.leverage - a.leverage || a.p - b.p
      : sort === 'rare' ? a.seen - b.seen || a.from - b.from
        : sort === 'common' ? b.seen - a.seen
          : a.from - b.from || b.seen - a.seen);

  const h = document.createElement('p');
  h.className = 'hint';
  h.innerHTML = 'Each tile is a <b>two-chord loop</b>, so you hear the move and the way back. '
    + 'A ✓ records the <b>root motion</b> and <b>the chord it landed on</b> as two separate facts — '
    + 'so ✓ on <code>Cm → Bm</code> and ✗ on <code>Cm → B</code> means "the move works, that colour doesn\'t", '
    + 'and neither cancels the other. Skipping a tile is <b>not</b> a rejection; only ✗ is. '
    + 'One ✓ is worth ' + DATA.earCount + ' corpus observations, so the <i>leverage</i> ordering puts the '
    + 'thin rows first — those are the moves where your ear actually changes what the generator reaches for.'
    + (pt === texture ? ''
      : '<br><b style="color:#e8a33d">Playing these in ' + texOf(pt).label + '</b> — the pair grid is only '
        + 'built in ' + DATA.pairTextures.map((x) => texOf(x).label).join(' and ') + ', so your verdict is about '
        + 'that format, not about ' + texOf(texture).label + '.');
  host.appendChild(h);

  const grid = document.createElement('div');
  grid.className = 'grid';
  for (const p of rows) {
    const pk = p.family + '|' + p.motion, ck = p.family + '|' + p.chord;
    const st = V.pairs[pk] || V.chords[ck];
    const el = document.createElement('div');
    el.className = 'tile' + (playing === 'p:' + pk + ck ? ' playing' : '') + (st ? ' ' + st : '');
    el.innerHTML = '<div class="big">' + p.label + '</div>'
      + '<div class="sub">' + p.numerals + '</div>'
      + '<div class="sub">' + p.seen + ' in corpus · ' + (100 * p.p).toFixed(1) + '%'
      + (V.pairs[pk] && !V.chords[ck] ? ' · move judged' : '') + '</div>';
    el.appendChild(acts([['pairs', pk], ['chords', ck]]));
    el.onclick = () => play('p:' + pk + ck, p.exprs[pt], p.bass, p.label + '   (' + p.numerals + ')');
    grid.appendChild(el);
  }
  host.appendChild(grid);
  if (!rows.length) host.appendChild(Object.assign(document.createElement('p'), { className: 'hint', textContent: 'nothing matches — try another family or clear the filters' }));
}

// ---------------------------------------------------------------------------
function renderTextures() {
  const host = $('textures');
  host.innerHTML = '';
  const h = document.createElement('p');
  h.className = 'hint';
  h.innerHTML = 'One harmony, every format, <b>select all that work</b> — not a ranking. '
    + 'These are progressions already believed good, so a ✗ here is a verdict on the <i>rendering</i>, '
    + 'not on the chords. That is the whole point: "some of the chords i rejected sound worse only in '
    + 'the format they were delivered."';
  host.appendChild(h);
  for (const H of DATA.harmonies) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<h3>' + H.symbols.join(' ') + '</h3>'
      + '<div class="sub">' + H.numerals + ' · ' + H.family + (H.song ? ' · ' + H.song : '') + '</div>';
    const strip = document.createElement('div');
    strip.className = 'strip';
    for (const t of DATA.textures) {
      const expr = H.exprs[t.id];
      // Keyed per HARMONY, not per format. A format's overall standing is an
      // aggregate the importer computes; storing only the aggregate here would
      // mean judging the next harmony silently overwrote the last one's opinion,
      // and "the arpeggio works for this progression but not that one" is
      // exactly the distinction the tab exists to capture.
      const key = H.name + '|' + t.id;
      const st = V.textures[key];
      const chip = document.createElement('div');
      chip.className = 'chip' + (expr ? '' : ' dead') + (playing === 'h:' + H.name + t.id ? ' playing' : '')
        + (st ? ' ' + st : '');
      chip.title = expr ? t.detail
        : t.detail + ' — no voicing shape for: ' + (H.missing[t.id] || []).join(', ');
      chip.innerHTML = '<span>' + (st === 'good' ? '✓ ' : st === 'bad' ? '✗ ' : '') + t.label + '</span>';
      const x = document.createElement('span');
      x.className = 'x'; x.textContent = '✗'; x.title = 'this format does not work here';
      x.onclick = (ev) => { ev.stopPropagation(); vote('textures', key, 'bad'); };
      chip.appendChild(x);
      if (expr) {
        chip.onclick = () => {
          vote('textures', key, 'good');
          play('h:' + H.name + t.id, expr, H.bass, H.symbols.join(' ') + '   ' + t.label,
            { block: (t.kind === 'figure' && $('withBlock').checked) ? H.exprs.block : null });
        };
      }
      strip.appendChild(chip);
    }
    card.appendChild(strip);
    host.appendChild(card);
  }
}

// ---------------------------------------------------------------------------
function renderCadences() {
  const host = $('cadences');
  host.innerHTML = '';
  const h = document.createElement('p');
  h.className = 'hint';
  h.innerHTML = 'The same loop ending three ways. <b>suspend the wrap</b> turns the last chord into a sus '
    + 'on the first chord\'s root, so the seam is <code>Xsus → X</code>; <b>suspend the penultimate</b> is '
    + 'the literal last-two-measures reading. Both cost the chord they replace. '
    + 'The <b>wrap chip</b> underneath votes on the loop\'s own last→first motion as a <i>cadence</i>, '
    + 'which is a separate question from whether that move works mid-loop — the corpus rates the two '
    + 'very differently and this page keeps them apart.';
  host.appendChild(h);
  for (const H of DATA.harmonies) {
    if (H.cadences.length < 2) continue;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<h3>' + H.symbols.join(' ') + '</h3><div class="sub">' + H.numerals + ' · ' + H.family + '</div>';
    const strip = document.createElement('div');
    strip.className = 'strip';
    for (const c of H.cadences) {
      const key = H.name + '|' + c.id; // per harmony; the importer aggregates by family × device
      const st = V.cadences[key];
      const chip = document.createElement('div');
      chip.className = 'chip' + (c.exprs.block ? '' : ' dead') + (playing === 'c:' + H.name + c.id ? ' playing' : '')
        + (st ? ' ' + st : '');
      chip.title = c.note + '   ' + c.symbols.join(' ');
      chip.innerHTML = '<span>' + (st === 'good' ? '✓ ' : st === 'bad' ? '✗ ' : '') + c.label
        + ' <span class="sub">' + c.symbols.slice(-2).join(' ') + '</span></span>';
      const x = document.createElement('span');
      x.className = 'x'; x.textContent = '✗';
      x.onclick = (ev) => { ev.stopPropagation(); vote('cadences', key, 'bad'); };
      chip.appendChild(x);
      if (c.exprs.block) {
        chip.onclick = () => {
          vote('cadences', key, 'good');
          play('c:' + H.name + c.id, c.exprs.block, c.bass, c.symbols.join(' ') + '   — ' + c.label);
        };
      }
      strip.appendChild(chip);
    }
    const wk = H.family + '|' + H.wrap.motion;
    const wst = V.wraps[wk];
    const w = document.createElement('div');
    w.className = 'chip' + (wst ? ' ' + wst : '');
    w.innerHTML = '<span>wrap: ' + H.wrap.label + '</span>';
    w.title = 'does this ending WORK as an ending? separate from the same move mid-loop';
    w.onclick = () => vote('wraps', wk, 'good');
    const wx = document.createElement('span');
    wx.className = 'x'; wx.textContent = '✗';
    wx.onclick = (ev) => { ev.stopPropagation(); vote('wraps', wk, 'bad'); };
    w.appendChild(wx);
    strip.appendChild(w);
    card.appendChild(strip);
    host.appendChild(card);
  }
}

function render() {
  $('pairs').hidden = tab !== 'pairs';
  $('textures').hidden = tab !== 'textures';
  $('cadences').hidden = tab !== 'cadences';
  $('pairCtl').style.display = tab === 'pairs' ? '' : 'none';
  if (tab === 'pairs') renderPairs(); else if (tab === 'textures') renderTextures(); else renderCadences();
  const n = (b) => Object.keys(V[b]).length;
  const g = (b) => Object.values(V[b]).filter((x) => x === 'good').length;
  $('tally').innerHTML = ['pairs', 'wraps', 'chords', 'textures', 'cadences']
    .map((b) => b + ' <b style="color:var(--keep)">' + g(b) + '</b>/' + n(b)).join(' · ');
}

// ---------------------------------------------------------------------------
const texWrap = $('tex');
for (const t of DATA.textures) {
  const b = document.createElement('button');
  b.textContent = t.label; b.title = t.detail;
  b.className = t.id === texture ? 'on' : '';
  b.dataset.tex = t.id;
  b.onclick = () => {
    texture = t.id;
    for (const c of texWrap.children) c.className = c.dataset.tex === texture ? 'on' : '';
    render();
  };
  texWrap.appendChild(b);
}
// Wired by id rather than by class so the DOM shim in test/helpers/dom.mjs can
// reach them — its querySelectorAll() returns nothing, which would have left the
// tabs untested and untestable.
const TABS = ['pairs', 'textures', 'cadences'];
for (const name of TABS) {
  $('tab-' + name).onclick = () => {
    tab = name;
    for (const o of TABS) $('tab-' + o).className = 'tab' + (o === name ? ' on' : '');
    render();
  };
}
{
  const seen = new Set();
  for (const p of DATA.pairs) {
    const k = p.family + '|' + p.from + '|' + p.fromQ;
    if (seen.has(k)) continue;
    seen.add(k);
  }
  for (let d = 0; d < 12; d++) $('fFrom').add(new Option('degree ' + d, String(d)));
}
$('bassLabel').textContent = '(' + DATA.bassLabel + ')';
// Set every control explicitly rather than leaning on the browser's implicit
// "first <option> wins" — a page whose initial state depends on that renders
// nothing at all under a DOM that does not implement it, which is exactly how
// the first version of this page came up with zero tiles.
$('fFam').value = 'minor';
$('fSort').value = 'leverage';
$('fFrom').value = '';
$('fText').value = '';
for (const id of ['fFam', 'fSort', 'fFrom', 'fUnjudged', 'fText']) $(id).oninput = render;
$('bpm').oninput = () => { $('bpmv').textContent = $('bpm').value; };
$('stop').onclick = stop;
$('export').onclick = async () => {
  const out = { page: 'facets', generated: new Date().toISOString(), texture, ...V };
  const ok = await rtCopy(JSON.stringify(out, null, 2));
  $('export').textContent = ok ? 'copied ✓' : 'copy failed';
  setTimeout(() => { $('export').textContent = 'copy facet JSON'; }, 1200);
};
document.onkeydown = (ev) => {
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT') return;
  if (ev.key === 'Escape') stop();
};
render();
</script>
