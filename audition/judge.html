<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>motif-engine — judging</title>
<style>
  :root { --bg:#12131a; --fg:#e8e9f0; --dim:#8a8d9f; --line:#2a2c39; --acc:#7dd3a0; --warn:#e0a458; --no:#e07070; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 ui-sans-serif,system-ui,sans-serif; }
  header { padding:12px 20px 11px; border-bottom:1px solid var(--line); }
  .hrow { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.02em; }
  /* the bar tracks WHERE YOU ARE; the lighter fill behind it is how much is
     answered. Two different facts, and conflating them is why "back" looked
     like it did nothing. */
  .prog { flex:1; min-width:120px; height:6px; background:var(--line); border-radius:3px; overflow:hidden; position:relative; }
  .prog > .ans { position:absolute; inset:0 auto 0 0; background:#2f4c3c; }
  .prog > .pos { position:absolute; inset:0 auto 0 0; background:var(--acc); transition:width .18s; }
  .count { color:var(--dim); font-variant-numeric:tabular-nums; font-size:13px; }
  main { max-width:1060px; margin:0 auto; padding:26px 20px 80px;
         display:grid; grid-template-columns:1fr 232px; gap:26px; align-items:start; }
  @media (max-width:860px) { main { grid-template-columns:1fr; } aside { position:static !important; } }
  .asks { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px; }
  .q { font-size:20px; font-weight:600; margin:0 0 4px; line-height:1.35; }
  .hint { color:var(--dim); font-size:13px; margin:0 0 20px; }
  .sides { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:20px 0; }
  @media (max-width:660px) { .sides { grid-template-columns:1fr; } }
  .side { border:1px solid var(--line); border-radius:10px; padding:15px; background:#171823; }
  .side h3 { margin:0 0 7px; font-size:13px; color:var(--dim); font-weight:500; }
  .syms { font:14px ui-monospace,monospace; margin-bottom:11px; word-spacing:.3em; }
  .trim { color:var(--warn); cursor:help; }
  button { font:inherit; color:var(--fg); background:#22243244; border:1px solid var(--line); border-radius:7px; padding:9px 14px; cursor:pointer; }
  button:hover { border-color:var(--dim); }
  button.pick { width:100%; font-weight:600; margin-top:10px; }

  /* one row per tone: [ name ] [ play ] [ thumbs down ] */
  .tones { display:flex; flex-direction:column; gap:5px; }
  .tone { display:flex; gap:4px; align-items:stretch; }
  .tone button { padding:6px 9px; font-size:13px; border-radius:6px; }
  .tone .tname { flex:1; text-align:left; }
  .tone .tplay, .tone .tdown { width:32px; padding:6px 0; text-align:center; color:var(--dim); flex:none; }
  .tone .tdown { font-size:12px; }
  .tone.liked   .tname { background:#1e3a2b; border-color:var(--acc); color:#d8f5e4; font-weight:600; }
  .tone.disliked .tname { border-color:#5a3438; color:#8f7276; text-decoration:line-through; }
  .tone.disliked .tdown { background:#3a2024; border-color:var(--no); color:#f0c0c0; }
  .tone.playing .tplay { background:var(--acc); color:#12131a; border-color:var(--acc); }
  .tone .both { font-size:10px; color:var(--acc); margin-left:6px; letter-spacing:.06em; }

  .opts { display:flex; flex-direction:column; gap:8px; margin:20px 0; }
  .opts button { text-align:left; }
  .extra { display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
  .extra button { color:var(--dim); }
  textarea { width:100%; background:#171823; color:var(--fg); border:1px solid var(--line);
             border-radius:8px; padding:10px; font:inherit; resize:vertical; }
  aside { position:sticky; top:16px; border:1px solid var(--line); border-radius:10px;
          background:#171823; padding:13px 14px 14px; }
  aside h4 { margin:0 0 3px; font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--dim); font-weight:600; }
  aside .why { color:var(--dim); font-size:11.5px; line-height:1.45; margin:0 0 9px; }
  aside textarea { min-height:104px; font-size:13.5px; }
  aside .saved { font-size:11.5px; color:var(--acc); min-height:15px; margin-top:5px; }
  aside .heard { font-size:11.5px; color:var(--dim); margin-top:10px; line-height:1.5; }
  .kbd { display:inline-block; border:1px solid var(--line); border-radius:4px; padding:0 5px;
         font:12px ui-monospace,monospace; color:var(--dim); }
  .done { text-align:center; padding:50px 0; }
  .done p { color:var(--dim); }
  .note { color:var(--dim); font-size:13px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>motif-engine · judging</h1>
    <div class="prog"><div class="ans" id="ansbar" style="width:0"></div><div class="pos" id="bar" style="width:0"></div></div>
    <span class="count" id="count"></span>
    <button id="back">‹ back</button>
    <button id="skip">skip ›</button>
    <label class="count"><input type="checkbox" id="bass" checked> bass <span id="bassLabel"></span></label>
    <button id="export">copy answers</button>
    <span class="count" id="rtstatus"></span>
  </div>
</header>
<main>
  <div id="main"></div>
  <aside>
    <h4>notes</h4>
    <p class="why">Anything you noticed — a chord pair that worked, a tone that
    ruined it, a rule. Saved as you type, and kept if you skip.</p>
    <textarea id="note" placeholder="e.g. Cm Bm is a pretty good transition, the progression around it isn't"></textarea>
    <div class="saved" id="saved"></div>
    <div class="heard" id="heard"></div>
  </aside>
</main>
<script src="https://unpkg.com/@strudel/web@1.1.0/dist/index.js"></script>

// registered, whether the background-safe clock is live, and what went wrong.
globalThis.RT = RT;

function shimSource(names) {
  return 'const s = globalThis.strudel;\n'
    + names.map((n) => 'export const ' + n + ' = s.' + n + ';').join('\n');
}
function soundfont2ShimSource(url, names) {
  return 'await import(' + JSON.stringify(url) + ');\n'
    + 'const ns = globalThis.SoundFont2;\n'
    + 'if (!ns) throw new Error("soundfont2 loaded but set no global to read");\n'
    + names.map((n) => 'export const ' + n + ' = ns.' + n + ';').join('\n');
}
function rewriteSoundfontSource(src, shims) {
  let out = String(src);
  for (const [spec, target] of Object.entries(shims)) {
    out = out.split('"' + spec + '"').join('"' + target + '"');
    out = out.split("'" + spec + "'").join("'" + target + "'");
  }
  const left = [];
  const re = /\bfrom\s*["']([^"']+)["']/g;
  let m;
  while ((m = re.exec(out))) if (!/^(https?:|blob:|data:|\.{0,2}\/)/.test(m[1])) left.push(m[1]);
  if (left.length) {
    throw new Error('unresolvable imports survived the rewrite (' + [...new Set(left)].join(', ')
      + ') - @strudel/soundfonts changed its dependencies');
  }
  return out;
}

const rtBlob = (src) => URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
/** a module re-exporting the live strudel globals, addressable by URL */
function rtShim(names) {
  const missing = names.filter((n) => !(n in (globalThis.strudel || {})));
  if (missing.length) {
    throw new Error('the strudel bundle is missing ' + missing.join(', ')
      + ' - the soundfont shim cannot be built against it');
  }
  return rtBlob(shimSource(names));
}
/** first mirror that answers, as text */
async function rtFetchText(urls, what) {
  const errors = [];
  for (const url of urls) {
    try {
      const res = await Promise.race([
        fetch(url),
        rtSleep(20000).then(() => { throw new Error('timed out'); }),
      ]);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.text();
    } catch (e) {
      errors.push('  ' + url + ' - ' + (e && e.message ? e.message : e));
    }
  }
  throw new Error(what + ' unreachable:\n' + errors.join('\n'));
}
/** sfumato, with its broken soundfont2 import repointed at a working shim */
async function rtSfumatoShim() {
  // the UMD is fetched and blobbed like everything else rather than imported
  // by URL, so it gets the same mirror list as the rest of the chain
  const umd = rtBlob(await rtFetchText(SOUNDFONT2_URLS, 'soundfont2'));
  const sf2 = rtBlob(soundfont2ShimSource(umd, SOUNDFONT2_EXPORTS));
  const src = await rtFetchText(SFUMATO_URLS, 'sfumato');
  return rtBlob(rewriteSoundfontSource(src, { soundfont2: sf2 }));
}
async function rtLoadSoundfonts() {
  const errors = [];
  // Count what actually registers rather than trusting that the import
  // succeeded: "the module loaded" and "there are 125 playable instruments" are
  // different claims, and only the second is the one an ear can hear.
  //
  // The counter has to go on BEFORE the shims are built. shimSource() captures
  // registerSound BY VALUE when the shim module evaluates, so a wrapper
  // installed afterwards is invisible to every call the bank makes — the first
  // version of this counted zero every time and disabled the whole bank.
  let count = 0;
  const realRegister = globalThis.strudel && globalThis.strudel.registerSound;
  if (realRegister) {
    globalThis.strudel.registerSound = function (name) {
      if (/^gm_/.test(name)) count++;
      return realRegister.apply(this, arguments);
    };
  }
  try {
    let shims;
    try {
      shims = { sfumato: await rtSfumatoShim() };
      for (const [spec, names] of Object.entries(SHIM_EXPORTS)) shims[spec] = rtShim(names);
    } catch (e) {
      return { ok: false, detail: 'General MIDI soundfonts unavailable:\n  ' + (e && e.message ? e.message : e) };
    }
    for (const url of SOUNDFONT_URLS) {
      try {
        const src = await rtFetchText([url], 'soundfonts');
        const mod = await import(rtBlob(rewriteSoundfontSource(src, shims)));
        if (typeof mod.registerSoundfonts !== 'function') throw new Error('no registerSoundfonts export');
        const before = count;
        mod.registerSoundfonts();
        if (count === before) throw new Error('registerSoundfonts() ran but registered no gm_ voices');
        return { ok: true, url, count: count - before };
      } catch (e) {
        errors.push('  ' + url + ' - ' + (e && e.message ? e.message : e));
      }
    }
  } finally {
    if (realRegister) globalThis.strudel.registerSound = realRegister;
  }
  return { ok: false, detail: 'General MIDI soundfonts unavailable:\n' + errors.join('\n') };
}

function rtBanner(msg, kind) {
  let el = document.getElementById('rtbanner');
  if (!el) {
    el = document.createElement('div');
    el.id = 'rtbanner';
    el.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99;padding:8px 16px;font:13px/1.5 -apple-system,system-ui,sans-serif;white-space:pre-wrap';
    document.body.appendChild(el);
  }
  el.style.background = kind === 'error' ? '#4a1420' : '#14304a';
  el.style.color = kind === 'error' ? '#ffb3c0' : '#bfe0ff';
  el.style.borderBottom = '1px solid ' + (kind === 'error' ? '#7d2437' : '#2b5a80');
  el.textContent = msg;
  el.style.display = msg ? '' : 'none';
}
window.addEventListener('error', (e) => rtBanner('JS error: ' + (e.message || e.error) + '  (' + (e.filename || '') + ':' + (e.lineno || '?') + ')', 'error'));
window.addEventListener('unhandledrejection', (e) => rtBanner('Unhandled: ' + (e.reason && e.reason.message ? e.reason.message : e.reason), 'error'));

function rtStatus(s) {
  RT.note = s;
  const el = document.getElementById('rtstatus');
  if (el) el.textContent = s;
}

const rtSleep = (ms) => new Promise((r) => setTimeout(r, ms));

const rtBundleReady = () => typeof strudel !== 'undefined' && typeof window.initStrudel === 'function';

function rtInjectScript(url) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = url;
    el.onload = () => resolve();
    el.onerror = () => reject(new Error('blocked or unreachable'));
    document.head.appendChild(el);
  });
}

/** The page's own <script src> is the first attempt; if that host is blocked,
 *  try the mirrors before declaring the page dead. Returns the errors so the
 *  message can name what was actually tried rather than blaming the user. */
async function rtLoadBundle() {
  if (rtBundleReady()) return { ok: true };
  const errors = [];
  for (const url of WEB_BUNDLE_URLS) {
    try {
      await rtInjectScript(url);
      if (rtBundleReady()) return { ok: true, url };
      errors.push('  ' + url + ' — loaded but set no global');
    } catch (e) {
      errors.push('  ' + url + ' — ' + (e && e.message ? e.message : e));
    }
  }
  return { ok: false, errors };
}

/**
 * A TIMER THAT A BACKGROUND TAB CANNOT THROTTLE (D56).
 *
 * Ethan: "if i leave the page the music doesnt slow down dramatically".
 *
 * Strudel's scheduler clock is, in the 1.1.0 bundle:
 *
 *   function ol(getTime, tick, duration=.05, interval=.1, overlap=.1,
 *               r = globalThis.setInterval, s = globalThis.clearInterval)
 *
 * It wakes every 100ms and schedules only (interval + overlap) = 200ms of audio
 * ahead. Chrome clamps main-thread setInterval to ONE SECOND in a hidden tab, so
 * the scheduler wakes 5x too slowly for the lookahead it keeps — the audio graph
 * starves and the music staggers. That is the whole bug: not a CPU problem, a
 * wake-up problem.
 *
 * Timers inside a Web Worker are not clamped the same way, so the tick is moved
 * there. createClock reads the timer functions off globalThis as DEFAULT
 * PARAMETERS, evaluated when the clock is constructed, so replacing them is all
 * it takes — no fork, no patched bundle.
 *
 * ONLY SHORT INTERVALS ARE REROUTED. Anything at or under RT_TICK_MAX_MS is an
 * audio scheduler; longer ones are UI housekeeping that SHOULD idle when the tab
 * is hidden, and stealing those into a worker would keep the tab awake for no
 * benefit.
 *
 * Verified from file://: a blob: Worker constructs and round-trips there, which
 * is not true of blob: AudioWorklets — so this is the one unthrottled clock
 * available to a page opened straight off disk.
 */
const RT_TICK_MAX_MS = 250;

function rtInstallWorkerClock() {
  if (RT.workerClock || typeof Worker === 'undefined') return;
  const src = 'const t = {};'
    + 'onmessage = (e) => { const d = e.data;'
    + ' if (d.a === "set") { t[d.id] = setInterval(() => postMessage(d.id), d.ms); }'
    + ' else if (d.a === "clear") { clearInterval(t[d.id]); delete t[d.id]; } };';
  let w;
  try {
    w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  } catch (e) {
    // No worker (a stricter file:// policy, an extension). Native timers still
    // work; the tab just throttles when hidden, which is the old behaviour.
    RT.problems.push('background-safe timer unavailable (' + e.message
      + ') — audio may stagger while this tab is in the background');
    return;
  }
  const cbs = new Map();
  const live = new Map();   // id -> { native, seen }
  let next = 1;
  w.onmessage = (e) => {
    const rec = live.get(e.data);
    if (rec) rec.seen = true;
    const fn = cbs.get(e.data);
    if (fn) { RT.workerTicks++; fn(); }
  };
  const nativeSet = globalThis.setInterval.bind(globalThis);
  const nativeClear = globalThis.clearInterval.bind(globalThis);
  const nativeTimeout = globalThis.setTimeout.bind(globalThis);

  globalThis.setInterval = (fn, ms, ...rest) => {
    if (!(ms <= RT_TICK_MAX_MS)) return nativeSet(fn, ms, ...rest);
    const id = 'w' + (next++);
    cbs.set(id, fn);
    live.set(id, { native: null, seen: false });
    RT.workerTimers++;
    w.postMessage({ a: 'set', id, ms });
    // WATCHDOG. Rerouting the clock is only worth doing if it cannot make things
    // WORSE than the bug it fixes, and a worker that never ticks would not
    // stagger the audio — it would stop it dead. So every rerouted timer is
    // given a deadline: if the worker has produced nothing by the time several
    // ticks were due, that timer silently reverts to a native one and RT says so.
    const rec = live.get(id);
    rec.native = nativeTimeout(() => {
      if (rec.seen || !live.has(id)) return;
      w.postMessage({ a: 'clear', id });
      RT.workerClockFellBack = true;
      const fallback = nativeSet(fn, ms, ...rest);
      rec.fallbackId = fallback;
    }, Math.max(600, ms * 5));
    return id;
  };
  globalThis.clearInterval = (id) => {
    if (typeof id === 'string' && id[0] === 'w') {
      const rec = live.get(id);
      if (rec) {
        if (rec.native != null) clearTimeout(rec.native);
        if (rec.fallbackId != null) nativeClear(rec.fallbackId);
      }
      cbs.delete(id); live.delete(id);
      w.postMessage({ a: 'clear', id });
      return;
    }
    return nativeClear(id);
  };
  RT.workerClock = true;
}

async function rtInit() {
  if (RT.ready) return;
  if (RT.booting) return RT.booting;
  RT.booting = (async () => {
    if (!rtBundleReady()) {
      rtStatus('fetching the audio bundle…');
      const got = await rtLoadBundle();
      if (!got.ok) {
        throw new Error('the strudel audio bundle could not be loaded from any mirror:\n'
          + got.errors.join('\n')
          + '\nThe page needs network access the first time. A content blocker on CDN scripts will do this too.');
      }
    }
    rtStatus('starting audio…');
    // BEFORE initStrudel(), which is where the scheduler clock is constructed
    // and where it captures its timer functions off globalThis.
    rtInstallWorkerClock();
    await window.initStrudel();
    // Browsers start the AudioContext suspended until a user gesture. Every call
    // path here is inside a click, but resume() explicitly rather than assuming.
    try {
      const ac = strudel.getAudioContext && strudel.getAudioContext();
      if (ac && ac.state !== 'running') await ac.resume();
    } catch (e) { /* older bundles expose no context getter */ }
    rtStatus('loading soundfonts…');
    const sf = await rtLoadSoundfonts();
    RT.soundfonts = sf.ok;
    RT.gmVoices = sf.count || 0;
    if (!sf.ok) {
      RT.problems.push(sf.detail + '\nEvery gm_* voice falls back to "' + GM_FALLBACK
        + '", so the whole General MIDI palette sounds like one synth.');
    }
    rtStatus('loading samples…');
    // Never block forever on a sample fetch, and never let one map take the
    // other down: drums failing should not cost you the piano. A hung request
    // is indistinguishable from a broken page from the outside.
    const loadMap = async (name, urls) => {
      const errors = [];
      for (const url of urls) {
        try {
          await Promise.race([
            strudel.samples(url),
            rtSleep(20000).then(() => { throw new Error('timed out'); }),
          ]);
          RT.maps[name] = url;
          return { name, ok: true };
        } catch (e) {
          errors.push('  ' + url + ' — ' + (e && e.message ? e.message : e));
        }
      }
      return { name, ok: false, detail: name + ' samples unreachable:\n' + errors.join('\n') };
    };
    const results = await Promise.all(Object.entries(SAMPLE_MAPS).map(([n, urls]) => loadMap(n, urls)));
    const failed = results.filter((r) => !r.ok);
    RT.ready = true;
    if (failed.length === results.length && !RT.soundfonts) {
      throw new Error('nothing can sound: every sample mirror failed AND the soundfont bank did not load.\n'
        + failed.map((f) => f.detail).join('\n')
        + '\nCheck network access, or an extension blocking raw.githubusercontent.com and jsdelivr.net.');
    }
    if (failed.length) {
      const pianoGone = !RT.maps.piano;
      RT.problems.push('Some sample maps are unavailable'
        + (pianoGone && RT.soundfonts ? ' — the piano falls back to the General MIDI "' + PIANO_FALLBACK + '"' : ', the rest will play')
        + ':\n' + failed.map((f) => f.detail).join('\n'));
    }
    // Report EVERY subsystem that degraded, not just the last to fail. The old
    // code cleared the banner whenever the sample maps loaded, which wiped the
    // soundfont warning off the screen — so the page quietly reduced the whole
    // GM palette to one synth and then said nothing at all about it.
    rtBanner(RT.problems.join('\n\n'), RT.problems.length ? 'error' : null);
    // Say what is actually loaded, every time. "Still triangle" cost two rounds
    // of guessing because the page reported nothing once it stopped erroring:
    // there was no way to tell a working build from a stale one without an ear.
    rtStatus(RT.soundfonts
      ? 'ready · ' + RT.gmVoices + ' GM voices · build ' + BUILD
      : 'ready · GM UNAVAILABLE, every instrument is the "' + GM_FALLBACK + '" synth · build ' + BUILD);
  })();
  try { await RT.booting; } finally { RT.booting = null; }
}

/** Swap sounds whose source never loaded for ones that did, so a missing
 *  dependency degrades the timbre instead of silencing the page. */
function rtSubstituteSounds(code) {
  let out = String(code);
  if (!RT.soundfonts) out = out.replace(/\.s\("gm_[a-z0-9_]+"\)/g, '.s("' + GM_FALLBACK + '")');
  if (!RT.maps.piano && RT.soundfonts) out = out.replace(/\.s\("piano"\)/g, '.s("' + PIANO_FALLBACK + '")');
  return out;
}

/** play(code) -> true if it started, false if it reported a reason instead.
 *  Plays are GENERATION-GUARDED: booting and sample loading are async, so two
 *  quick clicks used to race and leave both patterns sounding. Each call takes
 *  a ticket; a call that finds itself superseded hushes and bows out, and the
 *  previous pattern is always hushed before the next is evaluated. */
async function rtPlay(code) {
  const gen = ++RT.gen;
  try {
    await rtInit();
    if (gen !== RT.gen) return false; // a newer click won while we were booting
    try { strudel.hush(); } catch (e) {}
    await strudel.evaluate(rtSubstituteSounds(code));
    if (gen !== RT.gen) { try { strudel.hush(); } catch (e) {} return false; }
    return true;
  } catch (e) {
    if (gen !== RT.gen) return false;
    rtBanner('Could not play: ' + (e && e.message ? e.message : e), 'error');
    rtStatus('error');
    return false;
  }
}
function rtStop() { RT.gen++; try { if (RT.ready) strudel.hush(); } catch (e) {} }

async function rtCopy(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  return ok;
}

// If the bundle never arrived, say so up front instead of on first click.
window.addEventListener('load', () => {
  if (typeof strudel === 'undefined') {
    rtBanner('The strudel audio bundle did not load from unpkg.com — the page will render but cannot play. Check network access or an extension blocking CDN scripts, then reload.', 'error');
  }
});


const LS = 'motif-engine:judge-answers';
const LSN = 'motif-engine:judge-notes';
const LST = 'motif-engine:judge-tones';
const LSP = 'motif-engine:judge-pos';
const LSH = 'motif-engine:judge-heard';
const read = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || d); } catch { return JSON.parse(d); } };

let answers = read(LS, '{}');
let notes = read(LSN, '{}');
// TONE VOTES. Keyed by the HARMONY (its degrees string) and the tone, not by
// trial — the same progression turns up in more than one trial, and an opinion
// about how it should be voiced does not depend on what it was being compared
// against. 'good' / 'bad' rather than like/dislike, so these drop straight into
// the D53 facet bags without translation.
let tones = read(LST, '{}');
let heard = read(LSH, '{}');

const save = () => localStorage.setItem(LS, JSON.stringify(answers));
// Notes are written on every keystroke, into their own key. A note is worth
// more than the verdict it came with; a lost sentence is the most expensive
// small bug on this page.
const saveNotes = () => localStorage.setItem(LSN, JSON.stringify(notes));
const saveTones = () => localStorage.setItem(LST, JSON.stringify(tones));
const $ = (id) => document.getElementById(id);

let playing = null;      // "<side>|<tone>" of whatever is sounding
let lastTone = DATA.patterns[0].id;

// WHERE YOU ARE is persisted. Without this, refreshing after pressing 'back'
// jumped straight past the trial you had gone back to look at, because the
// position was recomputed as "first unanswered" every load.
// Read presence, not just numeric validity: Number(null) is 0, so testing the
// parsed value alone would treat "never saved a position" as "saved position 0"
// and strand a returning user at trial 1 instead of their first unanswered one.
const savedPos = localStorage.getItem(LSP);
let i = savedPos == null ? NaN : Number(savedPos);
if (!Number.isInteger(i) || i < 0 || i > DATA.trials.length) {
  i = 0;
  while (i < DATA.trials.length && answers[DATA.trials[i].id]) i++;
}
const savePos = () => localStorage.setItem(LSP, String(i));
const go = (n) => {
  rtStop(); playing = null;
  i = Math.max(0, Math.min(DATA.trials.length, n));
  savePos(); draw();
};

const patOf = (id) => DATA.patterns.find((p) => p.id === id);
const toneKey = (side, toneId) => side.degrees + '|' + toneId;

function codeFor(side, toneId) {
  const p = patOf(toneId);
  const expr = side.pats[toneId];
  // Every trial ships every tone, so this cannot be empty — but a blank
  // interpolated into stack() is a silent dead page, so it is checked anyway.
  if (!expr || !p) return null;
  // The bass line rides with the stacked tones and not with the figurations,
  // which already state the root in the bass register; doubling it there just
  // muddies the low end. The toggle overrides in both directions.
  const withBass = $('bass').checked && p.bass;
  return 'setcpm(110/4)\n' + DATA.preamble + '\np: stack('
    + (withBass ? expr + ', ' + side.bass : expr) + ').transpose(0)';
}

async function play(side, which, toneId) {
  const tag = which + '|' + toneId;
  if (playing === tag) { rtStop(); playing = null; draw(); return; }
  playing = tag;
  lastTone = toneId;
  const t = DATA.trials[i];
  if (t) {
    heard[t.id] = heard[t.id] || [];
    if (heard[t.id].indexOf(toneId) < 0) heard[t.id].push(toneId);
    localStorage.setItem(LSH, JSON.stringify(heard));
  }
  draw();
  const code = codeFor(side, toneId);
  if (code) await rtPlay(code);
}

/** three states, never two: unjudged / good / bad. An untouched tone means
 *  "haven't decided", and reading that as a rejection would invent negative
 *  evidence out of how far down the list you got. */
function voteTone(side, toneId, val) {
  const k = toneKey(side, toneId);
  if (tones[k] === val) delete tones[k]; else tones[k] = val;
  saveTones();
  draw();
}

function answer(value) {
  const t = DATA.trials[i];
  const text = $('note') ? $('note').value.trim() : '';
  answers[t.id] = {
    type: t.type, value, note: text || undefined, asks: t.meta && t.meta.asks,
    a: t.a && t.a.arm, b: t.b && t.b.arm, name: t.name,
    // WHICH TONE was last sounding, and everything auditioned on the way. A
    // preference that flips between block chords and an arpeggio is a finding
    // about texture; one that holds across six is about harmony.
    pattern: lastTone, heard: (heard[t.id] || []).slice(),
  };
  save();
  go(i + 1);
}

/** [ tone name ][ play ][ thumbs down ] — the name IS the like button */
function toneRows(side, which, other) {
  const box = document.createElement('div');
  box.className = 'tones';
  for (const p of DATA.patterns) {
    const k = toneKey(side, p.id);
    const v = tones[k];
    const row = document.createElement('div');
    row.className = 'tone' + (v === 'good' ? ' liked' : v === 'bad' ? ' disliked' : '')
      + (playing === which + '|' + p.id ? ' playing' : '');

    const name = document.createElement('button');
    name.className = 'tname';
    name.title = p.blurb + '   (' + p.detail + ')\nclick to mark this tone as one that works here';
    name.textContent = p.label;
    // A tone liked on BOTH sides of the trial works regardless of which harmony
    // it is carrying — which is a different and stronger claim than liking it
    // on one, and worth being able to see at a glance.
    if (other && tones[toneKey(other, p.id)] === 'good' && v === 'good') {
      const b = document.createElement('span');
      b.className = 'both';
      b.textContent = 'BOTH';
      name.appendChild(b);
    }
    name.onclick = () => voteTone(side, p.id, 'good');
    row.appendChild(name);

    const pb = document.createElement('button');
    pb.className = 'tplay';
    pb.title = 'play this side with this tone';
    pb.textContent = playing === which + '|' + p.id ? '\u25a0' : '\u25b6';
    pb.onclick = () => play(side, which, p.id);
    row.appendChild(pb);

    const db = document.createElement('button');
    db.className = 'tdown';
    db.title = 'this tone does not work on this chord';
    db.textContent = '\ud83d\udc4e';
    db.onclick = () => voteTone(side, p.id, 'bad');
    row.appendChild(db);

    box.appendChild(row);
  }
  return box;
}

function draw() {
  const m = $('main');
  const n = DATA.trials.length;
  const done = Object.keys(answers).length;
  // POSITION drives the bright bar and the counter; the dim fill behind it is
  // how much has been answered. Before this, both showed 'done', so stepping
  // back through trials looked like nothing had happened.
  $('bar').style.width = (100 * Math.min(i, n) / n) + '%';
  $('ansbar').style.width = (100 * done / n) + '%';
  $('count').textContent = (i >= n ? n : i + 1) + ' / ' + n + '  ·  ' + done + ' answered';

  const t0 = DATA.trials[i];
  const nb = $('note');
  if (nb) nb.value = (t0 && notes[t0.id]) || '';
  if ($('saved')) $('saved').textContent = '';
  const hd = $('heard');
  if (hd) {
    const h = (t0 && heard[t0.id]) || [];
    hd.innerHTML = !t0 ? ''
      : h.length ? 'heard in: <b>' + h.map((x) => patOf(x).label).join(', ') + '</b>'
        : 'not played yet — try at least two tones before deciding';
  }

  if (i >= n) {
    m.innerHTML = '<div class="done"><h2>Done — ' + done + ' answers.</h2>' +
      '<p>Hit <b>copy answers</b> and paste them back, then run<br>' +
      '<code>node scripts/import-verdicts.mjs &lt;file.json&gt;</code></p></div>';
    return;
  }
  const t = t0;
  m.innerHTML = '';

  const asks = document.createElement('div');
  asks.className = 'asks';
  asks.textContent = (t.meta && t.meta.asks) || t.type;
  m.appendChild(asks);

  const q = document.createElement('h2');
  q.className = 'q';
  q.textContent = t.question;
  m.appendChild(q);

  if (t.hint) {
    const h = document.createElement('p');
    h.className = 'hint';
    h.textContent = t.hint;
    m.appendChild(h);
  }
  if (answers[t.id]) {
    const p = document.createElement('p');
    p.className = 'hint';
    p.innerHTML = 'already answered: <b>' + answers[t.id].value + '</b> — answering again replaces it';
    m.appendChild(p);
  }

  if (t.type === 'ab') {
    const wrap = document.createElement('div');
    wrap.className = 'sides';
    for (const [k, side, other] of [['A', t.a, t.b], ['B', t.b, t.a]]) {
      const d = document.createElement('div');
      d.className = 'side';
      const h = document.createElement('h3');
      h.textContent = k;
      d.appendChild(h);
      const s = document.createElement('div');
      s.className = 'syms';
      s.textContent = side.symbols.join('  ');
      if (side.wrap) {
        const w = document.createElement('span');
        w.className = 'trim';
        w.textContent = ' ↺';
        w.title = side.wrap.action === 'replace'
          ? 'the written progression ended by repeating its first chord; looped, that doubles a bar. 4/4 is an even meter, so the duplicate is REPLACED (D56 meter-first). Alternates for in-song variation: ' + side.wrap.options.join(', ')
          : 'the written progression ended by repeating its first chord; trimmed for loop playback (D56)';
        s.appendChild(w);
      }
      d.appendChild(s);
      d.appendChild(toneRows(side, k, other));
      const cb = document.createElement('button');
      cb.className = 'pick';
      cb.textContent = 'pick ' + k;
      cb.onclick = () => answer(k);
      d.appendChild(cb);
      wrap.appendChild(d);
    }
    m.appendChild(wrap);
    const ex = document.createElement('div');
    ex.className = 'extra';
    for (const [v, txt] of [['same', 'too close to call'], ['neither', 'neither is any good'],
      ['depends', 'depends on the tone']]) {
      const b = document.createElement('button');
      b.textContent = txt;
      b.onclick = () => answer(v);
      ex.appendChild(b);
    }
    m.appendChild(ex);
    const kb = document.createElement('p');
    kb.className = 'note';
    kb.innerHTML = '<span class="kbd">1</span>–<span class="kbd">6</span> play that tone on A, '
      + '<span class="kbd">shift</span>+ for B &nbsp; <span class="kbd">A</span>/<span class="kbd">B</span> pick &nbsp; '
      + '<span class="kbd">S</span> same &nbsp; <span class="kbd">N</span> neither &nbsp; <span class="kbd">D</span> depends'
      + ' &nbsp; <span class="kbd">\u2190</span><span class="kbd">\u2192</span> back/skip';
    m.appendChild(kb);
    return;
  }

  // single-stimulus trials — same tone list, one card
  const lab = document.createElement('div');
  lab.className = 'hint';
  lab.textContent = t.label + '  ·  ' + t.symbols.join('  ')
    + (t.wrap ? '  ↺ ' + (t.wrap.action === 'replace' ? 'last chord replaced (was a repeat of the first)' : 'trimmed') : '');
  m.appendChild(lab);
  const card = document.createElement('div');
  card.className = 'side';
  card.appendChild(toneRows(t, 'X', null));
  m.appendChild(card);

  if (t.type === 'layer') {
    const o = document.createElement('div');
    o.className = 'opts';
    t.options.forEach((opt, ix) => {
      const b = document.createElement('button');
      b.textContent = (ix + 1) + '. ' + opt;
      b.onclick = () => answer(opt);
      o.appendChild(b);
    });
    m.appendChild(o);
    const kb = document.createElement('p');
    kb.className = 'note';
    kb.innerHTML = '<span class="kbd">1</span>–<span class="kbd">6</span> play a tone &nbsp; '
      + '<span class="kbd">shift</span>+<span class="kbd">1</span>–<span class="kbd">7</span> answer &nbsp; '
      + '<span class="kbd">\u2190</span><span class="kbd">\u2192</span> back/skip';
    m.appendChild(kb);
    return;
  }

  const sub = document.createElement('div');
  sub.className = 'extra';
  const b = document.createElement('button');
  b.textContent = 'submit  (\u2318\u21b5 in the notes box)';
  b.onclick = () => answer('open');
  sub.appendChild(b);
  m.appendChild(sub);
  if ($('note')) $('note').focus();
}

$('note').oninput = () => {
  const t = DATA.trials[i];
  if (!t) return;
  notes[t.id] = $('note').value;
  saveNotes();
  $('saved').textContent = $('note').value.trim() ? 'saved' : '';
};

document.onkeydown = (e) => {
  const t = DATA.trials[i];
  const typing = e.target && e.target.tagName === 'TEXTAREA';
  if (typing) {
    // Cmd/Ctrl+Enter submits an OPEN trial and otherwise just lets go of the
    // box, so the single-key shortcuts work again. The old build answered
    // "skip" here, which threw the trial away mid-sentence.
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      if (t && t.type === 'open') answer('open'); else e.target.blur();
    }
    return;
  }
  if (e.key === 'ArrowLeft') { e.preventDefault(); return go(i - 1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); return go(i + 1); }
  if (!t) return;
  // e.code so shift+1 is still recognisably "1" rather than "!"
  const digit = /^Digit([1-9])$/.exec(e.code || '');
  if (digit) {
    const ix = Number(digit[1]) - 1;
    if (t.type === 'layer' && e.shiftKey) {
      const opt = t.options[ix];
      if (opt) answer(opt);
      return;
    }
    const p = DATA.patterns[ix];
    if (!p) return;
    const side = t.type === 'ab' ? (e.shiftKey ? t.b : t.a) : t;
    const which = t.type === 'ab' ? (e.shiftKey ? 'B' : 'A') : 'X';
    play(side, which, p.id);
    return;
  }
  const k = e.key.toLowerCase();
  if (t.type === 'ab') {
    if (k === 'a') answer('A');
    else if (k === 'b') answer('B');
    else if (k === 's') answer('same');
    else if (k === 'n') answer('neither');
    else if (k === 'd') answer('depends');
  }
};

$('bassLabel').textContent = '(' + DATA.bassLabel + ', stacked tones only)';
$('bass').onchange = () => {
  if (!playing) return;
  const [which, toneId] = playing.split('|');
  const t = DATA.trials[i];
  const side = which === 'A' ? t.a : which === 'B' ? t.b : t;
  playing = null;
  play(side, which, toneId);
};
$('back').onclick = () => go(i - 1);
$('skip').onclick = () => go(i + 1);
$('export').onclick = async () => {
  // Notes on trials that were never answered ship too — a sentence Ethan typed
  // and then skipped past is exactly the kind of thing this page exists for.
  const stray = {};
  for (const id of Object.keys(notes)) {
    if (!answers[id] && notes[id].trim()) stray[id] = notes[id].trim();
  }
  const out = { generated: new Date().toISOString(), page: 'judge', answers, tones, strayNotes: stray };
  const ok = await rtCopy(JSON.stringify(out, null, 2));
  $('export').textContent = ok ? 'copied \u2713' : 'copy failed';
  setTimeout(() => { $('export').textContent = 'copy answers'; }, 1200);
};

// rtInit() is lazy — the first play boots audio inside the click gesture.
draw();
</script>
</body>
</html>
