<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>unison packs — audition</title>
<style>
  :root { color-scheme: dark; --bg:#14141a; --panel:#1b1b24; --line:#2b2b36; --fg:#e8e8ee; --dim:#9a9ab0; --accent:#d9822b; --keep:#37b24d; --kill:#e03131; --warn:#e8a33d; }
  * { box-sizing:border-box; }
  body { font:13.5px/1.5 -apple-system, system-ui, sans-serif; margin:0; background:var(--bg); color:var(--fg); }
  header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:10px 18px 8px; }
  .row { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; }
  h1 { font-size:15px; margin:0 8px 0 0; }
  .dim { color:var(--dim); font-size:12.5px; }
  label.ctl { display:inline-flex; align-items:center; gap:6px; color:var(--dim); }
  select, input[type=search] { background:#1e1e28; color:var(--fg); border:1px solid #3a3a4a; border-radius:6px; padding:4px 8px; font:inherit; }
  input[type=range] { accent-color:var(--accent); width:100px; vertical-align:middle; }
  input[type=checkbox] { accent-color:var(--accent); }
  button { font:inherit; border-radius:6px; border:1px solid #3a3a4a; background:#1e1e28; color:#cfcfe0; cursor:pointer; padding:4px 10px; }
  button:hover { border-color:#5a5a6e; }
  button.on { background:var(--accent); border-color:var(--accent); color:#1a1208; font-weight:600; }
  .tabs button { padding:5px 14px; }
  .now { font-variant-numeric:tabular-nums; color:var(--accent); font-weight:600; }
  main { padding:14px 18px 60px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:9px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:9px 11px 8px; cursor:pointer; position:relative; }
  .card:hover { border-color:#4a4a5e; }
  .card.sel { border-color:var(--accent); }
  .card.playing { background:#2a2114; border-color:var(--accent); }
  .card.keep { border-left:3px solid var(--keep); }
  .card.kill { border-left:3px solid var(--kill); opacity:.5; }
  .num { font-family:ui-monospace, Menlo, monospace; font-size:12px; color:var(--dim); word-break:break-all; }
  .sym { font-weight:650; font-size:14px; margin:2px 0 4px; }
  .tags { font-size:11.5px; color:var(--dim); min-height:15px; }
  .flag { display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:#1a1208; background:var(--warn); border-radius:3px; padding:0 5px; margin-right:5px; font-weight:700; }
  .badge { position:absolute; top:8px; right:10px; font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:#6b6b84; }
  .acts { display:flex; gap:5px; margin-top:7px; flex-wrap:wrap; }
  .acts button { padding:2px 8px; font-size:11.5px; }
  .acts button.k.on { background:var(--keep); border-color:var(--keep); color:#fff; }
  .acts button.x.on { background:var(--kill); border-color:var(--kill); color:#fff; }
  footer { position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:1px solid var(--line); padding:7px 18px; display:flex; gap:16px; align-items:center; font-size:12.5px; }
  kbd { background:#252531; border:1px solid #3a3a4a; border-radius:4px; padding:0 5px; font:11.5px ui-monospace,monospace; }
  .note { background:#1b1b24; border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:0 8px 8px 0; padding:9px 13px; margin-bottom:12px; font-size:12.5px; color:#c9c9dc; }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>unison packs — audition</h1>
    <div class="tabs" id="tabs"></div>
    <span class="dim" id="count"></span>
    <span class="now" id="now">— click a card to play —</span>
    <button id="stop">■ stop</button>
    <span class="dim" id="rtstatus">click any card to start audio</span>
  </div>
  <div class="row" style="margin-top:7px" id="controls"></div>
</header>
<main>
  <div class="note" id="blurb"></div>
  <div class="grid" id="grid"></div>
</main>
<footer>
  <span id="tally"></span>
  <span style="flex:1"></span>
  <span class="dim"><kbd>&larr;&rarr;&uarr;&darr;</kbd> move <kbd>space</kbd> play <kbd>k</kbd> keep <kbd>x</kbd> kill <kbd>a</kbd> A/B lib <kbd>esc</kbd> stop</span>
  <button id="export">copy verdicts JSON</button>
</footer>
<script src="https://unpkg.com/@strudel/web@1.1.0/dist/index.js"></script>
<script>

// Full https URLs, NOT the github: shorthand: strudel's samples() appends
// "strudel.json" to any github: path, so github:.../piano.json resolves to
// ".../piano.json/strudel.json" and 404s. Two maps, because the pages need both
// a piano and Dirt-named drums, and initStrudel() prebakes neither.
// Each map lists MIRRORS, tried in order until one answers. raw.githubusercontent
// is the canonical host but browsers hit it inconsistently (rate limits, CORS
// from file://, extensions blocking it); jsdelivr serves the identical files
// from a CDN built for browser traffic. One flaky host must not mean silence.
const SAMPLE_MAPS = {
  drums: [
    'https://raw.githubusercontent.com/tidalcycles/dirt-samples/master/strudel.json',
    'https://cdn.jsdelivr.net/gh/tidalcycles/dirt-samples@master/strudel.json',
  ],
  piano: [
    'https://raw.githubusercontent.com/felixroos/dough-samples/main/piano.json',
    'https://cdn.jsdelivr.net/gh/felixroos/dough-samples@main/piano.json',
  ],
};
// If the piano map is unreachable but the soundfont bank loaded, the page can
// still play a piano — a General MIDI one. Losing the sampled piano is a
// downgrade; losing the whole page is not acceptable.
// NOT gm_acoustic_piano — that name appears in the package's tables but is not
// one of the 125 the bank actually registers. Verified against a real
// registerSoundfonts() run; a fallback that names a sound nobody registered is
// no fallback at all.
const PIANO_FALLBACK = 'gm_piano';
// General MIDI soundfonts (~128 instruments: gm_music_box, gm_vibraphone,
// gm_epiano1, gm_pad_warm …). @strudel/web does NOT bundle these — it is a
// separate ES module that registers the gm_* sound names; each font's audio is
// then fetched lazily the first time that instrument sounds, so registering is
// cheap. If it fails the page must not go silent: every gm_* voice is rewritten
// to a bundled fallback before evaluation. See D48 in the generator for why
// this needs a rewrite pass rather than a plain import().
const WEB_BUNDLE_URLS = ["https://unpkg.com/@strudel/web@1.1.0/dist/index.js","https://cdn.jsdelivr.net/npm/@strudel/web@1.1.0/dist/index.js"];
const SOUNDFONT_URLS = ["https://unpkg.com/@strudel/soundfonts@1.1.0/dist/index.mjs","https://cdn.jsdelivr.net/npm/@strudel/soundfonts@1.1.0/dist/index.mjs"];
const SFUMATO_URLS = ["https://unpkg.com/sfumato@0.1.2/dist/sfumato.js","https://cdn.jsdelivr.net/npm/sfumato@0.1.2/dist/sfumato.js"];
const SOUNDFONT2_URLS = ["https://unpkg.com/soundfont2@0.4.0/lib/SoundFont2.js","https://cdn.jsdelivr.net/npm/soundfont2@0.4.0/lib/SoundFont2.js"];
const SOUNDFONT2_EXPORTS = ["DEFAULT_GENERATOR_VALUES","SoundFont2"];
const SHIM_EXPORTS = {"@strudel/core":["freqToMidi","noteToMidi","getSoundIndex","Pattern","getPlayableNoteValue"],"@strudel/webaudio":["registerSound","getADSRValues","getAudioContext","getParamADSR","getVibratoOscillator","getPitchEnvelope"]};
const GM_FALLBACK = 'triangle';
const BUILD = '2026-08-26 21:14';
const RT = { ready: false, booting: null, note: '', soundfonts: false, gmVoices: 0, gen: 0, maps: {}, problems: [],
  // D56: set once the scheduler tick is running off a Web Worker, so a hidden
  // tab cannot clamp it to 1s. workerTicks is how a probe proves it is live.
  workerClock: false, workerTimers: 0, workerTicks: 0, workerClockFellBack: false };
// Exposed deliberately: when a page will not play, "open the console and read
// RT" is the whole diagnosis — which mirrors loaded, whether the soundfont bank
// registered, whether the background-safe clock is live, and what went wrong.
globalThis.RT = RT;

function shimSource(names) {
  return 'const s = globalThis.strudel;\n'
    + names.map((n) => 'export const ' + n + ' = s.' + n + ';').join('\n');
}
function soundfont2ShimSource(url, names) {
  return 'await import(' + JSON.stringify(url) + ');\n'
    + 'const ns = globalThis.SoundFont2;\n'
    + 'if (!ns) throw new Error("soundfont2 loaded but set no global to read");\n'
    + names.map((n) => 'export const ' + n + ' = ns.' + n + ';').join('\n');
}
function rewriteSoundfontSource(src, shims) {
  let out = String(src);
  for (const [spec, target] of Object.entries(shims)) {
    out = out.split('"' + spec + '"').join('"' + target + '"');
    out = out.split("'" + spec + "'").join("'" + target + "'");
  }
  const left = [];
  const re = /\bfrom\s*["']([^"']+)["']/g;
  let m;
  while ((m = re.exec(out))) if (!/^(https?:|blob:|data:|\.{0,2}\/)/.test(m[1])) left.push(m[1]);
  if (left.length) {
    throw new Error('unresolvable imports survived the rewrite (' + [...new Set(left)].join(', ')
      + ') - @strudel/soundfonts changed its dependencies');
  }
  return out;
}

const rtBlob = (src) => URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
/** a module re-exporting the live strudel globals, addressable by URL */
function rtShim(names) {
  const missing = names.filter((n) => !(n in (globalThis.strudel || {})));
  if (missing.length) {
    throw new Error('the strudel bundle is missing ' + missing.join(', ')
      + ' - the soundfont shim cannot be built against it');
  }
  return rtBlob(shimSource(names));
}
/** first mirror that answers, as text */
async function rtFetchText(urls, what) {
  const errors = [];
  for (const url of urls) {
    try {
      const res = await Promise.race([
        fetch(url),
        rtSleep(20000).then(() => { throw new Error('timed out'); }),
      ]);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.text();
    } catch (e) {
      errors.push('  ' + url + ' - ' + (e && e.message ? e.message : e));
    }
  }
  throw new Error(what + ' unreachable:\n' + errors.join('\n'));
}
/** sfumato, with its broken soundfont2 import repointed at a working shim */
async function rtSfumatoShim() {
  // the UMD is fetched and blobbed like everything else rather than imported
  // by URL, so it gets the same mirror list as the rest of the chain
  const umd = rtBlob(await rtFetchText(SOUNDFONT2_URLS, 'soundfont2'));
  const sf2 = rtBlob(soundfont2ShimSource(umd, SOUNDFONT2_EXPORTS));
  const src = await rtFetchText(SFUMATO_URLS, 'sfumato');
  return rtBlob(rewriteSoundfontSource(src, { soundfont2: sf2 }));
}
async function rtLoadSoundfonts() {
  const errors = [];
  // Count what actually registers rather than trusting that the import
  // succeeded: "the module loaded" and "there are 125 playable instruments" are
  // different claims, and only the second is the one an ear can hear.
  //
  // The counter has to go on BEFORE the shims are built. shimSource() captures
  // registerSound BY VALUE when the shim module evaluates, so a wrapper
  // installed afterwards is invisible to every call the bank makes — the first
  // version of this counted zero every time and disabled the whole bank.
  let count = 0;
  const realRegister = globalThis.strudel && globalThis.strudel.registerSound;
  if (realRegister) {
    globalThis.strudel.registerSound = function (name) {
      if (/^gm_/.test(name)) count++;
      return realRegister.apply(this, arguments);
    };
  }
  try {
    let shims;
    try {
      shims = { sfumato: await rtSfumatoShim() };
      for (const [spec, names] of Object.entries(SHIM_EXPORTS)) shims[spec] = rtShim(names);
    } catch (e) {
      return { ok: false, detail: 'General MIDI soundfonts unavailable:\n  ' + (e && e.message ? e.message : e) };
    }
    for (const url of SOUNDFONT_URLS) {
      try {
        const src = await rtFetchText([url], 'soundfonts');
        const mod = await import(rtBlob(rewriteSoundfontSource(src, shims)));
        if (typeof mod.registerSoundfonts !== 'function') throw new Error('no registerSoundfonts export');
        const before = count;
        mod.registerSoundfonts();
        if (count === before) throw new Error('registerSoundfonts() ran but registered no gm_ voices');
        return { ok: true, url, count: count - before };
      } catch (e) {
        errors.push('  ' + url + ' - ' + (e && e.message ? e.message : e));
      }
    }
  } finally {
    if (realRegister) globalThis.strudel.registerSound = realRegister;
  }
  return { ok: false, detail: 'General MIDI soundfonts unavailable:\n' + errors.join('\n') };
}

function rtBanner(msg, kind) {
  let el = document.getElementById('rtbanner');
  if (!el) {
    el = document.createElement('div');
    el.id = 'rtbanner';
    el.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99;padding:8px 16px;font:13px/1.5 -apple-system,system-ui,sans-serif;white-space:pre-wrap';
    document.body.appendChild(el);
  }
  el.style.background = kind === 'error' ? '#4a1420' : '#14304a';
  el.style.color = kind === 'error' ? '#ffb3c0' : '#bfe0ff';
  el.style.borderBottom = '1px solid ' + (kind === 'error' ? '#7d2437' : '#2b5a80');
  el.textContent = msg;
  el.style.display = msg ? '' : 'none';
}
window.addEventListener('error', (e) => rtBanner('JS error: ' + (e.message || e.error) + '  (' + (e.filename || '') + ':' + (e.lineno || '?') + ')', 'error'));
window.addEventListener('unhandledrejection', (e) => rtBanner('Unhandled: ' + (e.reason && e.reason.message ? e.reason.message : e.reason), 'error'));

function rtStatus(s) {
  RT.note = s;
  const el = document.getElementById('rtstatus');
  if (el) el.textContent = s;
}

const rtSleep = (ms) => new Promise((r) => setTimeout(r, ms));

const rtBundleReady = () => typeof strudel !== 'undefined' && typeof window.initStrudel === 'function';

function rtInjectScript(url) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = url;
    el.onload = () => resolve();
    el.onerror = () => reject(new Error('blocked or unreachable'));
    document.head.appendChild(el);
  });
}

/** The page's own <script src> is the first attempt; if that host is blocked,
 *  try the mirrors before declaring the page dead. Returns the errors so the
 *  message can name what was actually tried rather than blaming the user. */
async function rtLoadBundle() {
  if (rtBundleReady()) return { ok: true };
  const errors = [];
  for (const url of WEB_BUNDLE_URLS) {
    try {
      await rtInjectScript(url);
      if (rtBundleReady()) return { ok: true, url };
      errors.push('  ' + url + ' — loaded but set no global');
    } catch (e) {
      errors.push('  ' + url + ' — ' + (e && e.message ? e.message : e));
    }
  }
  return { ok: false, errors };
}

/**
 * A TIMER THAT A BACKGROUND TAB CANNOT THROTTLE (D56).
 *
 * Ethan: "if i leave the page the music doesnt slow down dramatically".
 *
 * Strudel's scheduler clock is, in the 1.1.0 bundle:
 *
 *   function ol(getTime, tick, duration=.05, interval=.1, overlap=.1,
 *               r = globalThis.setInterval, s = globalThis.clearInterval)
 *
 * It wakes every 100ms and schedules only (interval + overlap) = 200ms of audio
 * ahead. Chrome clamps main-thread setInterval to ONE SECOND in a hidden tab, so
 * the scheduler wakes 5x too slowly for the lookahead it keeps — the audio graph
 * starves and the music staggers. That is the whole bug: not a CPU problem, a
 * wake-up problem.
 *
 * Timers inside a Web Worker are not clamped the same way, so the tick is moved
 * there. createClock reads the timer functions off globalThis as DEFAULT
 * PARAMETERS, evaluated when the clock is constructed, so replacing them is all
 * it takes — no fork, no patched bundle.
 *
 * ONLY SHORT INTERVALS ARE REROUTED. Anything at or under RT_TICK_MAX_MS is an
 * audio scheduler; longer ones are UI housekeeping that SHOULD idle when the tab
 * is hidden, and stealing those into a worker would keep the tab awake for no
 * benefit.
 *
 * Verified from file://: a blob: Worker constructs and round-trips there, which
 * is not true of blob: AudioWorklets — so this is the one unthrottled clock
 * available to a page opened straight off disk.
 */
const RT_TICK_MAX_MS = 250;

function rtInstallWorkerClock() {
  if (RT.workerClock || typeof Worker === 'undefined') return;
  const src = 'const t = {};'
    + 'onmessage = (e) => { const d = e.data;'
    + ' if (d.a === "set") { t[d.id] = setInterval(() => postMessage(d.id), d.ms); }'
    + ' else if (d.a === "clear") { clearInterval(t[d.id]); delete t[d.id]; } };';
  let w;
  try {
    w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  } catch (e) {
    // No worker (a stricter file:// policy, an extension). Native timers still
    // work; the tab just throttles when hidden, which is the old behaviour.
    RT.problems.push('background-safe timer unavailable (' + e.message
      + ') — audio may stagger while this tab is in the background');
    return;
  }
  const cbs = new Map();
  const live = new Map();   // id -> { native, seen }
  let next = 1;
  w.onmessage = (e) => {
    const rec = live.get(e.data);
    if (rec) rec.seen = true;
    const fn = cbs.get(e.data);
    if (fn) { RT.workerTicks++; fn(); }
  };
  const nativeSet = globalThis.setInterval.bind(globalThis);
  const nativeClear = globalThis.clearInterval.bind(globalThis);
  const nativeTimeout = globalThis.setTimeout.bind(globalThis);

  globalThis.setInterval = (fn, ms, ...rest) => {
    if (!(ms <= RT_TICK_MAX_MS)) return nativeSet(fn, ms, ...rest);
    const id = 'w' + (next++);
    cbs.set(id, fn);
    live.set(id, { native: null, seen: false });
    RT.workerTimers++;
    w.postMessage({ a: 'set', id, ms });
    // WATCHDOG. Rerouting the clock is only worth doing if it cannot make things
    // WORSE than the bug it fixes, and a worker that never ticks would not
    // stagger the audio — it would stop it dead. So every rerouted timer is
    // given a deadline: if the worker has produced nothing by the time several
    // ticks were due, that timer silently reverts to a native one and RT says so.
    const rec = live.get(id);
    rec.native = nativeTimeout(() => {
      if (rec.seen || !live.has(id)) return;
      w.postMessage({ a: 'clear', id });
      RT.workerClockFellBack = true;
      const fallback = nativeSet(fn, ms, ...rest);
      rec.fallbackId = fallback;
    }, Math.max(600, ms * 5));
    return id;
  };
  globalThis.clearInterval = (id) => {
    if (typeof id === 'string' && id[0] === 'w') {
      const rec = live.get(id);
      if (rec) {
        if (rec.native != null) clearTimeout(rec.native);
        if (rec.fallbackId != null) nativeClear(rec.fallbackId);
      }
      cbs.delete(id); live.delete(id);
      w.postMessage({ a: 'clear', id });
      return;
    }
    return nativeClear(id);
  };
  RT.workerClock = true;
}

async function rtInit() {
  if (RT.ready) return;
  if (RT.booting) return RT.booting;
  RT.booting = (async () => {
    if (!rtBundleReady()) {
      rtStatus('fetching the audio bundle…');
      const got = await rtLoadBundle();
      if (!got.ok) {
        throw new Error('the strudel audio bundle could not be loaded from any mirror:\n'
          + got.errors.join('\n')
          + '\nThe page needs network access the first time. A content blocker on CDN scripts will do this too.');
      }
    }
    rtStatus('starting audio…');
    // BEFORE initStrudel(), which is where the scheduler clock is constructed
    // and where it captures its timer functions off globalThis.
    rtInstallWorkerClock();
    await window.initStrudel();
    // Browsers start the AudioContext suspended until a user gesture. Every call
    // path here is inside a click, but resume() explicitly rather than assuming.
    try {
      const ac = strudel.getAudioContext && strudel.getAudioContext();
      if (ac && ac.state !== 'running') await ac.resume();
    } catch (e) { /* older bundles expose no context getter */ }
    rtStatus('loading soundfonts…');
    const sf = await rtLoadSoundfonts();
    RT.soundfonts = sf.ok;
    RT.gmVoices = sf.count || 0;
    if (!sf.ok) {
      RT.problems.push(sf.detail + '\nEvery gm_* voice falls back to "' + GM_FALLBACK
        + '", so the whole General MIDI palette sounds like one synth.');
    }
    rtStatus('loading samples…');
    // Never block forever on a sample fetch, and never let one map take the
    // other down: drums failing should not cost you the piano. A hung request
    // is indistinguishable from a broken page from the outside.
    const loadMap = async (name, urls) => {
      const errors = [];
      for (const url of urls) {
        try {
          await Promise.race([
            strudel.samples(url),
            rtSleep(20000).then(() => { throw new Error('timed out'); }),
          ]);
          RT.maps[name] = url;
          return { name, ok: true };
        } catch (e) {
          errors.push('  ' + url + ' — ' + (e && e.message ? e.message : e));
        }
      }
      return { name, ok: false, detail: name + ' samples unreachable:\n' + errors.join('\n') };
    };
    const results = await Promise.all(Object.entries(SAMPLE_MAPS).map(([n, urls]) => loadMap(n, urls)));
    const failed = results.filter((r) => !r.ok);
    RT.ready = true;
    if (failed.length === results.length && !RT.soundfonts) {
      throw new Error('nothing can sound: every sample mirror failed AND the soundfont bank did not load.\n'
        + failed.map((f) => f.detail).join('\n')
        + '\nCheck network access, or an extension blocking raw.githubusercontent.com and jsdelivr.net.');
    }
    if (failed.length) {
      const pianoGone = !RT.maps.piano;
      RT.problems.push('Some sample maps are unavailable'
        + (pianoGone && RT.soundfonts ? ' — the piano falls back to the General MIDI "' + PIANO_FALLBACK + '"' : ', the rest will play')
        + ':\n' + failed.map((f) => f.detail).join('\n'));
    }
    // Report EVERY subsystem that degraded, not just the last to fail. The old
    // code cleared the banner whenever the sample maps loaded, which wiped the
    // soundfont warning off the screen — so the page quietly reduced the whole
    // GM palette to one synth and then said nothing at all about it.
    rtBanner(RT.problems.join('\n\n'), RT.problems.length ? 'error' : null);
    // Say what is actually loaded, every time. "Still triangle" cost two rounds
    // of guessing because the page reported nothing once it stopped erroring:
    // there was no way to tell a working build from a stale one without an ear.
    rtStatus(RT.soundfonts
      ? 'ready · ' + RT.gmVoices + ' GM voices · build ' + BUILD
      : 'ready · GM UNAVAILABLE, every instrument is the "' + GM_FALLBACK + '" synth · build ' + BUILD);
  })();
  try { await RT.booting; } finally { RT.booting = null; }
}

/** Swap sounds whose source never loaded for ones that did, so a missing
 *  dependency degrades the timbre instead of silencing the page. */
function rtSubstituteSounds(code) {
  let out = String(code);
  if (!RT.soundfonts) out = out.replace(/\.s\("gm_[a-z0-9_]+"\)/g, '.s("' + GM_FALLBACK + '")');

rue,"expr":"note(\"C3 Eb4 G4 D5\").s(\"piano\").room(0.3)","libraryExpr":null,"libraryShape":null},{"name":"voi_madd9_1","quality":"madd9","offsets":[0,12,15,19,26],"sources":["Minor Prog 02 (i-vimadd9-i-iv).mid"],"fillsGap":true,"expr":"note(\"C3 C4 Eb4 G4 D5\").s(\"piano\").room(0.3)","libraryExpr":null,"libraryShape":null},{"name":"voi_madd9_2","quality":"madd9","offsets":[0,15,19,24,26],"sources":["Minor Prog 02 (VImaj7-V-ivmadd9-i).mid"],"fillsGap":true,"expr":"note(\"C3 Eb4 G4 C5 D5\").s(\"piano\").room(0.3)","libraryExpr":null,"libraryShape":null},{"name":"voi_madd9_3","quality":"madd9","offsets":[0,14,15,19],"sources":["Minor Prog 01 (imadd9-IIImaj7#5-im7-IV7-VIadd9).mid"],"fillsGap":true,"expr":"note(\"C3 D4 Eb4 G4\").s(\"piano\").room(0.3)","libraryExpr":null,"libraryShape":null},{"name":"voi_o7_0","quality":"o7","offsets":[0,15,18,21,24],"sources":["Minor Prog 01 (i-VImaj7#11-ivdim7-i-iidim7-V7).mid"],"fillsGap":false,"expr":"note(\"C3 Eb4 Gb4 A4 C5\").s(\"piano\").room(0.3)","libraryExpr":"note(\"C3 Eb3 Gb3 A3\").s(\"piano\").room(0.3)","libraryShape":"closed_stack"},{"name":"voi_o7_1","quality":"o7","offsets":[0,17,21,27,30],"sources":["Minor Prog 01 (i-VImaj7#11-ivdim7-i-iidim7-V7).mid"],"fillsGap":false,"expr":"note(\"C3 F4 A4 Eb5 Gb5\").s(\"piano\").room(0.3)","libraryExpr":"note(\"C3 Eb3 Gb3 A3\").s(\"piano\").room(0.3)","libraryShape":"closed_stack"},{"name":"voi_o7_2","quality":"o7","offsets":[0,12,18,21],"sources":["Minor Prog 01 (i-iv-i-iv-iidim7).mid"],"fillsGap":false,"expr":"note(\"C3 C4 Gb4 A4\").s(\"piano\").room(0.3)","libraryExpr":"note(\"C3 Eb3 Gb3 A3\").s(\"piano\").room(0.3)","libraryShape":"closed_stack"},{"name":"voi_o7_3","quality":"o7","offsets":[0,12,15,18,21],"sources":["Minor Prog 02 (i-ivdim7-i-iidim7).mid"],"fillsGap":false,"expr":"note(\"C3 C4 Eb4 Gb4 A4\").s(\"piano\").room(0.3)","libraryExpr":"note(\"C3 Eb3 Gb3 A3\").s(\"piano\").room(0.3)","libraryShape":"closed_stack"},{"name":"voi_sus_0","quality":"sus","offsets":[5,12,1 const LS = 'motif-engine:unison-verdicts';
let verdicts = {}; try { verdicts = JSON.parse(localStorage.getItem(LS) || '{}'); } catch {}
let tab = 'progressions', texture = 'comp', playing = null, sel = 0, visible = [];
const $ = (id) => document.getElementById(id);
const save = () => localStorage.setItem(LS, JSON.stringify(verdicts));

const BLURB = {
  progressions: 'Numerals came from the filenames; every chord was checked against the notes in the MIDI. NEEDS EAR marks the ones where the two disagree — those are the entries whose labels I could not confirm. Voiced with the full ireal dictionary because these packs use extensions the library has no shapes for.',
  rhythms: 'Drum-loop parts. Cards marked ONSETS ONLY come from files with flat velocity: you are hearing the pattern with no dynamics, because the source has none and nothing was invented to fill it in. Play a whole loop to judge the parts together — they are co-designed.',
  voicings: 'How these records actually voice each quality, rooted at C3. GAP means the library has no shape for that quality at all. Where it does, press a to A/B the library shape against the record.',
};

function codeFor(e) {
  // Never interpolate a missing/blank control into the source: 'setcpm(' + '' +
  // '/4)' is a syntax error, and a pattern that fails to parse is indistinguishable
  // from a dead page.
  const bpm = Number($('bpm') && $('bpm').value) || 112;
  let body;
  if (tab === 'progressions') body = ($('bass') && $('bass').checked) ? 'stack(' + e.exprs[texture] + ', ' + e.bass + ')' : e.exprs[texture];
  else body = e.expr;
  return 'setcpm(' + bpm + '/4)\np: ' + body;
}
async function play(e, useLib) {
  const code = useLib && e.libraryExpr ? 'setcpm(112/4)\np: ' + e.libraryExpr : codeFor(e);
  $('now').textContent = RT.ready ? '…' : 'starting audio (first play loads the piano)…';
  const ok = await rtPlay(code);
  if (!ok) { playing = null; render(); return; }
  playing = e.name;
  $('now').textContent = '▶ ' + (useLib ? '[library shape] ' : '') + labelOf(e);
  render();
}
function stop() { rtStop(); playing = null; $('now').textContent = '— stopped —'; render(); }
function labelOf(e) {
  if (tab === 'progressions') return (e.song ? e.song + '  —  ' : '') + e.numerals + '   ' + e.symbols.join(' ');
  if (tab === 'rhythms') return e.loop ? (e.part ? e.loop + ' · ' + e.part : e.loop + ' (whole loop)') : e.name;
  return e.quality + '  [' + e.offsets.join(' ') + ']';
}

function items() {
  if (tab === 'progressions') return DATA.progressions;
  if (tab === 'rhythms') return DATA.loops.concat(DATA.rhythms);
  return DATA.voicings;
}
function matches(e) {
  const q = ($('q') ? $('q').value : '').trim().toLowerCase();
  if (q && !JSON.stringify([labelOf(e), e.moods || '', e.pack || '']).toLowerCase().includes(q)) return false;
  if (tab === 'progressions') {
    if ($('pack').value && e.pack !== $('pack').value) return false;
    if ($('fam').value && e.family !== $('fam').value) return false;
    if ($('ear').checked && !e.needsEar) return false;
  }
  if (tab === 'voicings' && $('gap') && $('gap').checked && !e.fillsGap) return false;
  return true;
}

function controls() {
  const c = $('controls');
  if (tab === 'progressions') {
    c.innerHTML = '<label class="ctl">texture <span id="tex"></span></label>' +
      '<label class="ctl"><input type="checkbox" id="bass" checked> bass</label>' +
      '<label class="ctl">bpm <input type="range" id="bpm" min="60" max="170" value="112"><span id="bpmv">112</span></label>' +
      '<label class="ctl">pack <select id="pack"><option value="">all</option>' + DATA.packs.map((p) => '<option>' + p + '</option>').join('') + '</select></label>' +
      '<label class="ctl">mode <select id="fam"><option value="">all</option><option>major</option><option>minor</option></select></label>' +
      '<label class="ctl"><input type="checkbox" id="ear"> only NEEDS EAR</label>' +
      '<input type="search" id="q" placeholder="search song / numerals">';
    const tw = $('tex');
    DATA.textures.forEach((t) => {
      const b = document.createElement('button');
      b.textContent = t.label; b.title = t.rhythm; b.className = t.id === texture ? 'on' : '';
      b.onclick = () => { texture = t.id; controls(); render(); if (playing) { const e = DATA.progressions.find((x) => x.name === playing); if (e) play(e); } };
      tw.appendChild(b);
    });
    $('bpm').oninput = () => { $('bpmv').textContent = $('bpm').value; if (playing) { const e = items().find((x) => x.name === playing); if (e) play(e); } };
  } else if (tab === 'rhythms') {
    c.innerHTML = '<label class="ctl">bpm <input type="range" id="bpm" min="60" max="170" value="106"><span id="bpmv">106</span></label>' +
      '<input type="search" id="q" placeholder="search loop / part">';
    $('bpm').oninput = () => { $('bpmv').textContent = $('bpm').value; if (playing) { const e = items().find((x) => x.name === playing); if (e) play(e); } };
  } else {
    c.innerHTML = '<label class="ctl"><input type="checkbox" id="gap" checked> only qualities the library lacks</label>' +
      '<input type="search" id="q" placeholder="search quality">';
  }
  for (const id of ['pack', 'fam', 'ear', 'gap', 'q', 'bass']) if ($(id)) $(id).oninput = render;
  $('blurb').textContent = BLURB[tab];
}

function render() {
  visible = items().filter(matches);
  if (sel >= visible.length) sel = Math.max(0, visible.length - 1);
  const grid = $('grid'); grid.innerHTML = '';
  visible.forEach((e, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (i === sel ? ' sel' : '') + (playing === e.name ? ' playing' : '') + (verdicts[e.name] ? ' ' + verdicts[e.name] : '');
    let head = '', body = '', tags = '', badge = '';
    if (tab === 'progressions') {
      badge = e.pack.replace('unison-', '');
      head = e.needsEar ? '<span class="flag">needs ear</span>' : '';
      body = '<div class="num">' + e.numerals + '</div><div class="sym">' + e.symbols.join(' ') + '</div>';
      tags = (e.song ? e.song + ' · ' : '') + (e.moods.join(' · ') || e.family) + ' · ' + e.length + ' chords';
      card.title = e.name + '\nlabel vs notes: ' + JSON.stringify(e.match) + '\nsource key solved as ' + e.sourceKey + (e.dirAgrees ? '' : ' (pack filed it under a different key)');
    } else if (tab === 'rhythms') {
      const whole = !e.part;
      badge = whole ? 'loop' : e.triage;
      head = e.needsAccents ? '<span class="flag">onsets only</span>' : '';
      body = '<div class="sym">' + (whole ? e.loop : e.part) + '</div><div class="num">' + (whole ? e.parts.join(' + ') : e.bars + ' bar · 1/' + e.grid + ' · ' + e.onsets + ' onsets') + '</div>';
      tags = whole ? 'whole loop · ' + e.bpm + ' bpm' : (e.mode + (e.microtiming ? ' · microtiming' : ''));
      card.title = e.name + (e.partners ? '\nco-designed with: ' + e.partners.join(', ') : '');
    } else {
      badge = e.fillsGap ? 'gap' : e.libraryShape;
      head = e.fillsGap ? '<span class="flag">no library shape</span>' : '';
      body = '<div class="sym">' + e.quality + '</div><div class="num">offsets [' + e.offsets.join(' ') + ']</div>';
      tags = 'seen ' + e.seen + '× · ' + e.sources.map((s) => s.replace(/\.mid$/, '').slice(0, 26)).join(', ');
    }
    card.innerHTML = '<div class="badge">' + badge + '</div>' + head + body + '<div class="tags">' + tags + '</div>';
    const acts = document.createElement('div'); acts.className = 'acts';
    for (const [cls, verd] of [['k', 'keep'], ['x', 'kill']]) {
      const b = document.createElement('button');
      b.className = cls + (verdicts[e.name] === verd ? ' on' : ''); b.textContent = verd;
      b.onclick = (ev) => { ev.stopPropagation(); mark(e, verd); };
      acts.appendChild(b);
    }
    if (e.libraryExpr) {
      const b = document.createElement('button'); b.textContent = 'A/B library';
      b.onclick = (ev) => { ev.stopPropagation(); play(e, true); };
      acts.appendChild(b);
    }
    const cp = document.createElement('button'); cp.textContent = 'copy';
    cp.onclick = (ev) => { ev.stopPropagation(); copy(e, cp); };
    acts.appendChild(cp);
    card.appendChild(acts);
    card.onclick = () => { sel = i; play(e); };
    grid.appendChild(card);
  });
  $('count').textContent = visible.length + ' shown';
  const k = Object.values(verdicts).filter((v) => v === 'keep').length;
  const x = Object.values(verdicts).filter((v) => v === 'kill').length;
  $('tally').innerHTML = '<b style="color:var(--keep)">' + k + ' kept</b> · <b style="color:var(--kill)">' + x + ' killed</b>';
}
function mark(e, verd) {
  if (verdicts[e.name] === verd) delete verdicts[e.name]; else verdicts[e.name] = verd;
  save(); render();
}
const toClipboard = rtCopy;
async function copy(e, btn) {
  const ok = await toClipboard(codeFor(e));
  const t = btn.textContent; btn.textContent = ok ? '✓' : '✗'; setTimeout(() => { btn.textContent = t; }, 900);
}
const tw = $('tabs');
for (const t of ['progressions', 'rhythms', 'voicings']) {
  const b = document.createElement('button');
  b.textContent = t; b.className = t === tab ? 'on' : '';
  b.onclick = () => { tab = t; sel = 0; [...tw.children].forEach((c) => c.className = c.textContent === tab ? 'on' : ''); controls(); render(); };
  tw.appendChild(b);
}
$('stop').onclick = stop;
$('export').onclick = async () => {
  const ok = await toClipboard(JSON.stringify({ verdicts }, null, 2));
  $('export').textContent = ok ? 'copied ✓' : 'copy failed';
  setTimeout(() => { $('export').textContent = 'copy verdicts JSON'; }, 1200);
};
document.onkeydown = (ev) => {
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT') return;
  const cols = Math.max(1, Math.floor($('grid').clientWidth / 241));
  const move = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[ev.key];
  if (move) { sel = Math.max(0, Math.min(visible.length - 1, sel + move)); render(); document.querySelectorAll('.card')[sel]?.scrollIntoView({ block: 'nearest' }); ev.preventDefault(); return; }
  if (ev.key === ' ') { const e = visible[sel]; if (e) (playing === e.name ? stop() : play(e)); ev.preventDefault(); return; }
  if (ev.key === 'Escape') return stop();
  if (ev.key === 'k' && visible[sel]) return mark(visible[sel], 'keep');
  if (ev.key === 'x' && visible[sel]) return mark(visible[sel], 'kill');
  if (ev.key === 'a' && visible[sel]?.libraryExpr) return play(visible[sel], true);
};
controls(); render();
</script>
