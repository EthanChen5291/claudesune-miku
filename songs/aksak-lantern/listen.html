<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aksak-lantern v0 — listen</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.5 -apple-system, system-ui, sans-serif; margin: 0; background: #14141a; color: #e8e8ee; }
  header { padding: 14px 20px 10px; border-bottom: 1px solid #2b2b36; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  h1 { font-size: 16px; margin: 0 12px 0 0; }
  .vswitch button { margin-right: 6px; padding: 6px 14px; border-radius: 6px; border: 1px solid #3a3a4a; background: #1e1e28; color: #cfcfe0; cursor: pointer; font-weight: 600; }
  .vswitch button.active { background: #4c6ef5; border-color: #4c6ef5; color: #fff; }
  .mutes { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 8px 20px; border-bottom: 1px solid #2b2b36; }
  .mutes label { user-select: none; cursor: pointer; opacity: .9; }
  .mutes input { accent-color: #4c6ef5; }
  main { padding: 12px 20px; }
  #repl { min-height: 420px; }
  strudel-editor { display: block; }
  .panel { background: #1b1b24; border: 1px solid #2b2b36; border-radius: 8px; padding: 12px 16px; margin: 14px 0; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #9a9ab0; margin: 0 0 8px; }
  .panel ul { margin: 0; padding-left: 18px; }
  button.copy { padding: 6px 12px; border-radius: 6px; border: 1px solid #3a3a4a; background: #1e1e28; color: #cfcfe0; cursor: pointer; }
  a { color: #74a0ff; }
  .hint { color: #9a9ab0; font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <h1>aksak-lantern v0</h1>
  <div class="vswitch" id="vswitch"></div>
  <span class="hint">switch version or mutes, then hit play in the editor (ctrl+enter updates)</span>
</header>
<div class="mutes" id="mutes"></div>
<main>
  <div id="repl"></div>
  <div class="panel" id="listenfor" style="display:none"><h2>What to listen for</h2><ul id="listenforList"></ul></div>
  <div class="panel">
    <h2>Paste-ready</h2>
    <button class="copy" id="copyBtn">Copy current code (with mutes)</button>
    <a id="ccLink" target="_blank" style="margin-left:12px">open on strudel.cc</a>
    <div class="hint" style="margin-top:6px">The embedded REPL is pinned to strudel 1.1.0 (same as the engine). strudel.cc runs latest — both play this code.</div>
  </div>
</main>
<script src="https://unpkg.com/@strudel/repl@1.1.0/dist/index.js"></script>
<script>
const DATA = {"title":"aksak-lantern v0","versions":[{"name":"v0","source":"// ============ aksak-lantern ============\n// compiled by motif-engine (seed 20260820) — edit map in the song's meta.json\n// form: A B C A | 7/8 | 140 bpm | key D:dorian\nsetcpm(140/7)\n\nlet key = \"D:dorian\"\n\n// ---- form masks (compiled from form: A B C A; edit the SPEC, not these) ----\nlet form = {\n  A: \"<1!8 0!16 1!8>\",\n  B: \"<0!8 1!8 0!16>\",\n  C: \"<0!16 1!8 0!8>\",\n}\n\n// ---- voicing shapes (library: src/lib/voicings.js) ----\naddVoicings('me_cluster_upper', { '6': ['7 9 14'], '7': ['7 10 14'], '': ['7 11 14'], 'm': ['7 10 14'], '^7': ['7 11 14'], 'm7': ['7 10 14'], 'm9': ['10 14 15'], 'sus4': ['5 7 12'], 'dim': ['6 9 12'], 'o': ['6 9 12'] }, ['C4', 'C6'])\naddVoicings('me_quartal_9', { '6': ['2 7 12'], '7': ['4 9 14'], '': ['0 7 14'], 'm': ['0 5 12'], '^7': ['4 9 14'], 'm7': ['0 5 10 15'], 'm9': ['2 7 12 17'], 'sus4': ['0 5 12'], 'dim': ['0 3 6'], 'o': ['0 3 6 9'] }, ['C3', 'C6'])\n\n// ---- harmony ----\nlet harmony_A = chord(\"<Dm7 G7>/4\").dict('ireal')\nlet harmony_B = chord(\"<Dm7 Em7 G7 Dm7>/2\").dict('ireal')\nlet harmony_C = chord(\"<Em7 A7>/4\").dict('ireal')\nlet chords = stack(\n  harmony_A.mask(form.A),\n  harmony_B.mask(form.B),\n  harmony_C.mask(form.C),\n)\n\n// ---- material: kick ----\nlet kick_A = s(\"bd ~ bd ~ bd ~@2\").gain(\"1@2 0.88@2 0.94@3\")\nlet kick_B = s(\"bd ~ bd ~ bd ~@2\").gain(\"1@2 0.88@2 0.94@3\")\nlet kick_C = s(\"bd ~ bd ~ bd ~@2\").gain(\"0.6@2 0.54@2 0.56@3\")\n\n// ---- material: hats ----\nlet hats_A = s(\"hh hh hh hh hh hh hh\").gain(\"1 0.61 0.86 0.62 0.9 0.64 0.73\")\nlet hats_B = s(\"hh hh hh hh hh hh hh\").gain(\"1 0.64 0.87 0.65 0.91 0.67 0.75\")\nlet hats_C = s(\"hh hh hh hh hh hh hh\").gain(\"0.5 0.29 0.42 0.3 0.45 0.31 0.35\")\n\n// ---- material: bass ----\nlet bass_A = note(\"<[D2@3 D2 A2@3 D2@2 D2@2 D2@3] [A2@3 D2 D2@3 D2@2 A2@2 D2@3] [D2@3 D2 A2@3 D2@2 D2@2 D2@3] [A2@3 D2 D2@3 D2@2 A2@2 D2@3] [D2@3 D2 A2@3 D2@2 D2@2 D2@3] [A2@3 D2 D2@3 D2@2 A2@2 D2@3] [D2@3 D2 A2@3 D2@2 D2@2 D2@3] [A2@3 D2 D2@3 D2@2 A2@2 D2@3]>\").s(\"sawtooth\").gain(\"1@3 0.68 0.87@3 0.94@2 0.71@2 0.82@3\").lpf(700)\nlet bass_B = note(\"<[D2@3 D2 A2@3 D2@2 D2@2 D2@3] [A2@3 D2 D2@3 D2@2 A2@2 D2@3] [D2@3 D2 A2@3 D2@2 D2@2 D2@3] [A2@3 D2 D2@3 D2@2 A2@2 D2@3] [D2@3 D2 A2@3 D2@2 D2@2 D2@3] [A2@3 D2 D2@3 D2@2 A2@2 D2@3] [D2@3 D2 A2@3 D2@2 D2@2 D2@3] [A2@3 D2 D2@3 D2@2 A2@2 D2@3]>\").s(\"sawtooth\").gain(\"1@3 0.68 0.87@3 0.94@2 0.71@2 0.82@3\").lpf(900)\n\n// ---- material: keys ----\nlet keys_A = chords.dict('me_quartal_9').voicing().struct(\"x ~ ~ ~ x ~ ~\").s(\"square\").lpf(1100).room(0.35).gain(\".5 .44\").orbit(2)\nlet keys_B = chords.dict('me_quartal_9').voicing().struct(\"x ~ ~ ~ x ~ ~\").s(\"square\").lpf(1400).room(0.35).gain(\".55 .48\").orbit(2)\nlet keys_C = chords.dict('me_cluster_upper').voicing().s(\"square\").lpf(800).room(0.55).gain(0.5).attack(0.25).orbit(2)\n\n// ---- material: lead ----\nlet lead_B = note(\"<[~ D4@4 F4@4 G4@4 B4] [~ C5@4 B4@4 G4@4 F4] [~ D4@4 F4@4 G4@4 B4] [~ B4@4 B4@4 G4@4 F4] [~ D4@4 F4@4 G4@4 B4] [~ B4@4 B4@4 G4@4 F4] [~ D4@4 F4@4 G4@4 B4] [~ C5@4 B4@4 G4@4 D4]>\").s(\"triangle\").gain(\"0.82 0.82@4 0.75@4 0.88@4 0.78\").delay(0.3).room(0.3).orbit(3)\nlet lead_C = note(\"<[~ D5@4 B4@4 A4@4 F4] [~ E4@4 F4@4 A4@4 B4] [~ D5@4 B4@4 A4@4 F4] [~ E4@4 F4@4 A4@4 B4] [~ C#5@4 B4@4 A4@4 F4] [~ E4@4 F4@4 A4@4 B4] [~ C#5@4 B4@4 A4@4 F4] [~ E4@4 F4@4 A4@4 B4]>\").s(\"triangle\").gain(\"0.82 0.82@4 0.75@4 0.88@4 0.78\").delay(0.35).room(0.45).orbit(3)\n\n// ---- transition: fill_tom_run: C -> A @ cycles 23-24 ----\nlet fill_A3 = s(\"[ht ht] [mt mt] [lt lt] [sd sd]\").gain(saw.range(0.55, 0.95)).speed(\"1 1 1 1.02\")\n\n// ---- transition: impact_boom: B -> C @ cycles 16-17 ----\nlet impact_C2 = s(\"bd, oh\").speed(\"0.6, 0.45\").gain(\"0.95, 0.6\").room(0.5)\n\n// ---- layers ----\nkick: stack(\n  kick_A.mask(form.A),\n  kick_B.mask(form.B),\n  kick_C.mask(form.C),\n)\nhats: stack(\n  hats_A.mask(form.A),\n  hats_B.mask(form.B),\n  hats_C.mask(form.C),\n)\nbass: stack(\n  bass_A.mask(form.A),\n  bass_B.mask(form.B),\n)\nkeys: stack(\n  keys_A.mask(form.A),\n  keys_B.mask(form.B),\n  keys_C.mask(form.C),\n)\nlead: stack(\n  lead_B.mask(form.B),\n  lead_C.mask(form.C),\n)\nfill: fill_A3.late(23).mask(\"<0!23 1 0!8>\")\nimpact: impact_C2.late(16).mask(\"<0!16 1 0!15>\")\n","note":"current"}],"labels":["kick","hats","bass","keys","lead","fill","impact"],"listenFor":["Section C withholds bass — their return is the payoff.","Transition \"fill_tom_run\" (fill) into A at cycles 23–24.","Transition \"impact_boom\" (impact) into C at cycles 16–17."],"notes":[]};
let currentVersion = DATA.versions.length - 1;
const muted = new Set();

function applyMutes(src) {
  let out = src;
  for (const label of DATA.labels) {
    const on = new RegExp('^(\\s*)' + label + ':', 'm');
    const off = new RegExp('^(\\s*)_' + label + ':', 'm');
    if (muted.has(label)) out = out.replace(on, '$1_' + label + ':');
    else out = out.replace(off, '$1' + label + ':');
  }
  return out;
}
function currentCode() { return applyMutes(DATA.versions[currentVersion].source); }
function render() {
  const holder = document.getElementById('repl');
  holder.innerHTML = '';
  const el = document.createElement('strudel-editor');
  el.setAttribute('code', currentCode());
  holder.appendChild(el);
  document.querySelectorAll('.vswitch button').forEach((b, i) => b.classList.toggle('active', i === currentVersion));
  document.getElementById('ccLink').href = 'https://strudel.cc/#' + encodeURIComponent(btoa(unescape(encodeURIComponent(currentCode()))));
}
const vs = document.getElementById('vswitch');
DATA.versions.forEach((v, i) => {
  const b = document.createElement('button');
  b.textContent = v.name;
  b.title = v.note || '';
  b.onclick = () => { currentVersion = i; render(); };
  vs.appendChild(b);
});
const ms = document.getElementById('mutes');
DATA.labels.forEach((label) => {
  const l = document.createElement('label');
  const c = document.createElement('input');
  c.type = 'checkbox'; c.checked = true;
  c.onchange = () => { c.checked ? muted.delete(label) : muted.add(label); render(); };
  l.appendChild(c); l.appendChild(document.createTextNode(' ' + label));
  ms.appendChild(l);
});
if (DATA.listenFor.length) {
  document.getElementById('listenfor').style.display = '';
  const ul = document.getElementById('listenforList');
  DATA.listenFor.forEach((x) => { const li = document.createElement('li'); li.textContent = x; ul.appendChild(li); });
}
document.getElementById('copyBtn').onclick = async () => {
  await navigator.clipboard.writeText(currentCode());
  document.getElementById('copyBtn').textContent = 'Copied ✓';
  setTimeout(() => document.getElementById('copyBtn').textContent = 'Copy current code (with mutes)', 1200);
};
render();
</script>
</body>
</html>
